<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="Architecture scaled to 1 million users. A CDN serves the app and files; a load balancer sends API and SSE traffic to autoscaled gateway pods. Auth, chat and agent services run as many replicas. All LLM calls go through an LLM gateway with a key pool, fallback, quotas and caching. A job queue feeds a message writer and Puppeteer render workers. Data sits in a Redis cluster, a sharded MongoDB replica set and S3. Green numbers mark the fix for each bottleneck in the current diagram."><style>svg{--bg:#f3f5f7;--panel:#ffffff;--ink:#17212b;--muted:#55636f;--line:#cdd5dc;--edge:#3f4d59;--ui-f:#e4eefb;--ui-s:#2a64b8;--svc-f:#e9ecf1;--svc-s:#3f4d59;--llm-f:#efe9fb;--llm-s:#6a3fc0;--ext-f:#fcf1da;--ext-s:#9a6400;--store-f:#dff2ef;--store-s:#0d7168;--out-f:#e6f3e0;--out-s:#3c7a27;--fail-f:#fcebe9;--fail-s:#b3261e;--live:#2a64b8;}@media (prefers-color-scheme:dark){svg{--bg:#11161b;--panel:#1a2128;--ink:#e7ecf0;--muted:#a0adb8;--line:#36424d;--edge:#a7b4bf;--ui-f:#15283f;--ui-s:#7baef0;--svc-f:#242c34;--svc-s:#a7b4bf;--llm-f:#2a2145;--llm-s:#ad90f2;--ext-f:#33280f;--ext-s:#deb159;--store-f:#10302e;--store-s:#55c6ba;--out-f:#1b2f15;--out-s:#8dcb75;--fail-f:#3a1816;--fail-s:#f28d85;--live:#7baef0;}}
.bg{fill:var(--panel)}text{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.n{stroke-width:1.4}.n-ui{fill:var(--ui-f);stroke:var(--ui-s)}.n-svc,.n-agent,.n-graph{fill:var(--svc-f);stroke:var(--svc-s)}.n-agent,.n-graph{stroke-width:2}
.n-step{fill:var(--panel);stroke:var(--edge)}.n-dec{fill:var(--panel);stroke:var(--ink);stroke-width:1.6}.n-llm{fill:var(--llm-f);stroke:var(--llm-s)}.n-ext{fill:var(--ext-f);stroke:var(--ext-s)}.n-store{fill:var(--store-f);stroke:var(--store-s)}.n-out{fill:var(--out-f);stroke:var(--out-s)}.n-fail{fill:var(--fail-f);stroke:var(--fail-s);stroke-dasharray:4 3}.n-pill{fill:var(--ink);stroke:var(--ink)}
.t{font-size:13px;font-weight:600;fill:var(--ink)}.s{font-size:11.5px;fill:var(--muted)}.n-pill + .t{fill:var(--bg)}
.l{font-size:11px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.l-fail{fill:var(--fail-s)}
.e{fill:none;stroke:var(--edge);stroke-width:1.4}.e-fail{stroke:var(--fail-s);stroke-dasharray:5 4}.e-data{stroke:var(--store-s);stroke-dasharray:2 3;stroke-width:1.7}.e-live{stroke:var(--live);stroke-width:2}
.m-flow{fill:var(--edge)}.m-fail{fill:var(--fail-s)}.m-data{fill:var(--store-s)}.m-live{fill:var(--live)}
.frame{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 3}.frame-label{font-size:11px;fill:var(--muted)}
.lane{fill:var(--bg);stroke:var(--line)}.lane-label{font-size:12.5px;font-weight:700;fill:var(--muted);letter-spacing:.04em}.title{font-size:20px;font-weight:700;fill:var(--ink)}.sub{font-size:12.5px;fill:var(--muted)}.bt{font-size:11px;font-weight:700}.b-bad{fill:var(--fail-f);stroke:var(--fail-s);stroke-width:1.6}.bt-bad{fill:var(--fail-s)}.b-ok{fill:var(--out-f);stroke:var(--out-s);stroke-width:1.6}.bt-ok{fill:var(--out-s)}.ph{font-size:13px;font-weight:700;fill:var(--ink)}.pl{font-size:11.5px;fill:var(--ink)}.pm{font-size:11.5px;fill:var(--muted)}</style><rect class="bg" width="1400" height="900" rx="10"/><defs><marker id="big-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-flow" d="M0 0 L10 5 L0 10 z"/></marker><marker id="big-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-data" d="M0 0 L10 5 L0 10 z"/></marker><marker id="big-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-fail" d="M0 0 L10 5 L0 10 z"/></marker><marker id="big-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-live" d="M0 0 L10 5 L0 10 z"/></marker></defs><text class="title" x="24" y="34">Aryan Assistant: scaled for 1 million users</text><text class="sub" x="24" y="54">Stateless services scale out on Kubernetes. Green numbers match the bottlenecks on the current-architecture diagram.</text><rect class="lane" x="20" y="64" width="170" height="646" rx="8"/><text class="lane-label" x="32" y="84">CLIENT</text><rect class="lane" x="205" y="64" width="200" height="646" rx="8"/><text class="lane-label" x="217" y="84">EDGE</text><rect class="lane" x="420" y="64" width="280" height="646" rx="8"/><text class="lane-label" x="432" y="84">SERVICES (AUTOSCALED)</text><rect class="lane" x="715" y="64" width="220" height="646" rx="8"/><text class="lane-label" x="727" y="84">ASYNC</text><rect class="lane" x="950" y="64" width="220" height="646" rx="8"/><text class="lane-label" x="962" y="84">DATA</text><rect class="lane" x="1185" y="64" width="195" height="646" rx="8"/><text class="lane-label" x="1197" y="84">EXTERNAL APIS</text><path class="e" d="M105 300 V147 H223" marker-end="url(#big-flow)"/><path class="e e-live" d="M165 332 H223" marker-end="url(#big-live)"/><path class="e" d="M305 364 V438" marker-end="url(#big-flow)"/><path class="e" d="M385 482 H410 V133 H438" marker-end="url(#big-flow)"/><path class="e" d="M410 233 H438" marker-end="url(#big-flow)"/><path class="e" d="M410 367 H438" marker-end="url(#big-flow)"/><path class="e" d="M560 108 V95 H1282 V108" marker-end="url(#big-flow)"/><path class="e e-data" d="M680 130 H968" marker-end="url(#big-data)"/><path class="e e-data" d="M680 240 H968" marker-end="url(#big-data)"/><path class="e" d="M560 315 V263" marker-end="url(#big-flow)"/><path class="e" d="M680 345 H705 V293 H733" marker-end="url(#big-flow)"/><path class="e" d="M870 262 V204" marker-end="url(#big-flow)"/><path class="e e-data" d="M915 171 H942 V262 H968" marker-end="url(#big-data)"/><path class="e" d="M825 324 V378" marker-end="url(#big-flow)"/><path class="e e-data" d="M915 442 H968" marker-end="url(#big-data)"/><path class="e" d="M560 420 V478" marker-end="url(#big-flow)"/><path class="e" d="M680 520 H1198" marker-end="url(#big-flow)"/><path class="e" d="M440 395 H428 V628 H1198" marker-end="url(#big-flow)"/><rect class="n n-ui" x="35" y="300" width="130" height="70" rx="8"/><text class="t" x="100.0" y="331.0" text-anchor="middle">Browser</text><text class="s" x="100.0" y="348.0" text-anchor="middle">React SPA</text><rect class="n n-svc" x="225" y="115" width="160" height="64" rx="8"/><text class="t" x="305.0" y="143.0" text-anchor="middle">CDN</text><text class="s" x="305.0" y="160.0" text-anchor="middle">static app · S3 files</text><rect class="n n-svc" x="225" y="300" width="160" height="64" rx="8"/><text class="t" x="305.0" y="328.0" text-anchor="middle">Load balancer</text><text class="s" x="305.0" y="345.0" text-anchor="middle">L7 · long SSE timeout</text><rect class="n n-svc" x="225" y="440" width="160" height="84" rx="8"/><text class="t" x="305.0" y="463.0" text-anchor="middle">Gateway ×N</text><text class="s" x="305.0" y="480.0" text-anchor="middle">session check</text><text class="s" x="305.0" y="495.0" text-anchor="middle">per-user rate limit</text><text class="s" x="305.0" y="510.0" text-anchor="middle">(both in Redis)</text><rect class="n n-svc" x="440" y="108" width="240" height="56" rx="8"/><text class="t" x="560.0" y="132.0" text-anchor="middle">Auth service ×N</text><text class="s" x="560.0" y="149.0" text-anchor="middle">scale on CPU</text><rect class="n n-svc" x="440" y="205" width="240" height="56" rx="8"/><text class="t" x="560.0" y="229.0" text-anchor="middle">Chat service ×N</text><text class="s" x="560.0" y="246.0" text-anchor="middle">reads via Redis cache</text><rect class="n n-agent" x="440" y="315" width="240" height="105" rx="8"/><text class="t" x="560.0" y="348.5" text-anchor="middle">Agent service ×N</text><text class="s" x="560.0" y="365.5" text-anchor="middle">LangGraph router → agents</text><text class="s" x="560.0" y="380.5" text-anchor="middle">SSE streaming only</text><text class="s" x="560.0" y="395.5" text-anchor="middle">scale on open streams</text><rect class="n n-llm" x="440" y="480" width="240" height="110" rx="8"/><text class="t" x="560.0" y="508.5" text-anchor="middle">LLM gateway</text><text class="s" x="560.0" y="525.5" text-anchor="middle">key pool · provider fallback</text><text class="s" x="560.0" y="540.5" text-anchor="middle">per-user token quotas</text><text class="s" x="560.0" y="555.5" text-anchor="middle">prompt + semantic cache</text><text class="s" x="560.0" y="570.5" text-anchor="middle">cheapest model that fits</text><rect class="n n-svc" x="735" y="140" width="180" height="62" rx="8"/><text class="t" x="825.0" y="167.0" text-anchor="middle">Message writer ×N</text><text class="s" x="825.0" y="184.0" text-anchor="middle">async saves to MongoDB</text><rect class="n n-ext" x="735" y="262" width="180" height="62" rx="8"/><text class="t" x="825.0" y="289.0" text-anchor="middle">Job queue</text><text class="s" x="825.0" y="306.0" text-anchor="middle">BullMQ / SQS</text><rect class="n n-svc" x="735" y="380" width="180" height="84" rx="8"/><text class="t" x="825.0" y="410.5" text-anchor="middle">Render workers ×N</text><text class="s" x="825.0" y="427.5" text-anchor="middle">Puppeteer PDF / PPT</text><text class="s" x="825.0" y="442.5" text-anchor="middle">scale on queue depth</text><rect class="n n-store" x="970" y="104" width="180" height="80" rx="8"/><text class="t" x="1060.0" y="132.5" text-anchor="middle">Redis Cluster</text><text class="s" x="1060.0" y="149.5" text-anchor="middle">sessions · rate limits</text><text class="s" x="1060.0" y="164.5" text-anchor="middle">history + reply cache</text><rect class="n n-store" x="970" y="225" width="180" height="80" rx="8"/><text class="t" x="1060.0" y="253.5" text-anchor="middle">MongoDB</text><text class="s" x="1060.0" y="270.5" text-anchor="middle">replica set</text><text class="s" x="1060.0" y="285.5" text-anchor="middle">sharded by userId</text><rect class="n n-store" x="970" y="410" width="180" height="64" rx="8"/><text class="t" x="1060.0" y="438.0" text-anchor="middle">AWS S3</text><text class="s" x="1060.0" y="455.0" text-anchor="middle">private · pre-signed URLs</text><rect class="n n-ext" x="1200" y="110" width="165" height="56" rx="8"/><text class="t" x="1282.5" y="134.0" text-anchor="middle">Firebase Auth</text><text class="s" x="1282.5" y="151.0" text-anchor="middle">Google sign-in</text><rect class="n n-llm" x="1200" y="470" width="165" height="80" rx="8"/><text class="t" x="1282.5" y="498.5" text-anchor="middle">LLM providers</text><text class="s" x="1282.5" y="515.5" text-anchor="middle">Groq · Gemini · OpenRouter</text><text class="s" x="1282.5" y="530.5" text-anchor="middle">paid tiers, many keys</text><rect class="n n-ext" x="1200" y="600" width="165" height="56" rx="8"/><text class="t" x="1282.5" y="624.0" text-anchor="middle">Tavily · Pollinations</text><text class="s" x="1282.5" y="641.0" text-anchor="middle">search · images</text><text class="l" x="150" y="140" text-anchor="middle">app + files</text><text class="l" x="194" y="322" text-anchor="middle">API + SSE</text><text class="l" x="1100" y="91" text-anchor="middle">verify Google token</text><text class="l" x="825" y="119" text-anchor="middle">create session</text><text class="l" x="785" y="234" text-anchor="middle">cache miss → MongoDB</text><text class="l" x="566" y="293" text-anchor="start">history (cached)</text><text class="l" x="712" y="360" text-anchor="start">enqueue</text><text class="l" x="948" y="212" text-anchor="start">batch writes</text><text class="l" x="942" y="436" text-anchor="middle">upload</text><text class="l" x="566" y="452" text-anchor="start">all LLM calls</text><text class="l" x="1000" y="514" text-anchor="middle">fallback on 429 / timeout</text><text class="l" x="1000" y="622" text-anchor="middle">search · image APIs</text><circle class="b-ok" cx="385" cy="300" r="10"/><text class="bt bt-ok" x="385" y="304" text-anchor="middle">1</text><circle class="b-ok" cx="385" cy="440" r="10"/><text class="bt bt-ok" x="385" y="444" text-anchor="middle">1</text><circle class="b-ok" cx="915" cy="380" r="10"/><text class="bt bt-ok" x="915" y="384" text-anchor="middle">2</text><circle class="b-ok" cx="915" cy="140" r="10"/><text class="bt bt-ok" x="915" y="144" text-anchor="middle">3</text><circle class="b-ok" cx="680" cy="205" r="10"/><text class="bt bt-ok" x="680" y="209" text-anchor="middle">3</text><circle class="b-ok" cx="1150" cy="104" r="10"/><text class="bt bt-ok" x="1150" y="108" text-anchor="middle">4</text><circle class="b-ok" cx="680" cy="480" r="10"/><text class="bt bt-ok" x="680" y="484" text-anchor="middle">5</text><circle class="b-ok" cx="440" cy="590" r="10"/><text class="bt bt-ok" x="440" y="594" text-anchor="middle">6</text><rect class="lane" x="20" y="725" width="1360" height="160" rx="8"/><text class="ph" x="34" y="749">How each bottleneck is fixed</text><circle class="b-ok" cx="44" cy="773" r="9"/><text class="bt bt-ok" x="44" y="777" text-anchor="middle">1</text><text class="pl" x="60" y="777">Load balancer + gateway and service replicas that autoscale; nothing is kept in memory.</text><circle class="b-ok" cx="604" cy="773" r="9"/><text class="bt bt-ok" x="604" y="777" text-anchor="middle">2</text><text class="pl" x="620" y="777">PDF / PPT jobs go on a queue; separate Puppeteer workers scale on queue depth.</text><circle class="b-ok" cx="44" cy="803" r="9"/><text class="bt bt-ok" x="44" y="807" text-anchor="middle">3</text><text class="pl" x="60" y="807">History is read from Redis; messages are saved asynchronously through the queue.</text><circle class="b-ok" cx="604" cy="803" r="9"/><text class="bt bt-ok" x="604" y="807" text-anchor="middle">4</text><text class="pl" x="620" y="807">Redis Cluster with replicas: no single point of failure for sessions.</text><circle class="b-ok" cx="44" cy="833" r="9"/><text class="bt bt-ok" x="44" y="837" text-anchor="middle">5</text><text class="pl" x="60" y="837">LLM gateway: pool of paid keys, fallback across providers, per-user token quotas.</text><circle class="b-ok" cx="604" cy="833" r="9"/><text class="bt bt-ok" x="604" y="837" text-anchor="middle">6</text><text class="pl" x="620" y="837">Summary + last few messages instead of 20; cache prompts and repeated answers.</text><line x1="1141" y1="739" x2="1141" y2="871" stroke="var(--line)"/><text class="ph" x="1155" y="749">Sizing (estimate)</text><text class="pm" x="1155" y="773">1M users · 100k daily</text><text class="pm" x="1155" y="789">≈1M messages / day</text><text class="pm" x="1155" y="805">≈100 msg/s at peak</text><text class="pm" x="1155" y="821">≈2,000 open streams</text><text class="pm" x="1155" y="837">≈2B tokens / day</text><text class="pm" x="1155" y="853">Observability: traces,</text><text class="pm" x="1155" y="869">p95 time-to-first-token</text></svg>