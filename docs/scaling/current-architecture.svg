<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 855" width="1200" height="855" role="img" aria-label="Current architecture of Aryan Assistant. The browser calls one gateway, which checks sessions in a single Redis container and forwards to the auth, chat and agent services. The agent service calls the chat service, LLM providers, Tavily, Pollinations and S3, and renders PDFs and decks with Puppeteer in the same process. Six numbered bottlenecks are listed at the bottom."><style>svg{--bg:#f3f5f7;--panel:#ffffff;--ink:#17212b;--muted:#55636f;--line:#cdd5dc;--edge:#3f4d59;--ui-f:#e4eefb;--ui-s:#2a64b8;--svc-f:#e9ecf1;--svc-s:#3f4d59;--llm-f:#efe9fb;--llm-s:#6a3fc0;--ext-f:#fcf1da;--ext-s:#9a6400;--store-f:#dff2ef;--store-s:#0d7168;--out-f:#e6f3e0;--out-s:#3c7a27;--fail-f:#fcebe9;--fail-s:#b3261e;--live:#2a64b8;}@media (prefers-color-scheme:dark){svg{--bg:#11161b;--panel:#1a2128;--ink:#e7ecf0;--muted:#a0adb8;--line:#36424d;--edge:#a7b4bf;--ui-f:#15283f;--ui-s:#7baef0;--svc-f:#242c34;--svc-s:#a7b4bf;--llm-f:#2a2145;--llm-s:#ad90f2;--ext-f:#33280f;--ext-s:#deb159;--store-f:#10302e;--store-s:#55c6ba;--out-f:#1b2f15;--out-s:#8dcb75;--fail-f:#3a1816;--fail-s:#f28d85;--live:#7baef0;}}
.bg{fill:var(--panel)}text{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.n{stroke-width:1.4}.n-ui{fill:var(--ui-f);stroke:var(--ui-s)}.n-svc,.n-agent,.n-graph{fill:var(--svc-f);stroke:var(--svc-s)}.n-agent,.n-graph{stroke-width:2}
.n-step{fill:var(--panel);stroke:var(--edge)}.n-dec{fill:var(--panel);stroke:var(--ink);stroke-width:1.6}.n-llm{fill:var(--llm-f);stroke:var(--llm-s)}.n-ext{fill:var(--ext-f);stroke:var(--ext-s)}.n-store{fill:var(--store-f);stroke:var(--store-s)}.n-out{fill:var(--out-f);stroke:var(--out-s)}.n-fail{fill:var(--fail-f);stroke:var(--fail-s);stroke-dasharray:4 3}.n-pill{fill:var(--ink);stroke:var(--ink)}
.t{font-size:13px;font-weight:600;fill:var(--ink)}.s{font-size:11.5px;fill:var(--muted)}.n-pill + .t{fill:var(--bg)}
.l{font-size:11px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.l-fail{fill:var(--fail-s)}
.e{fill:none;stroke:var(--edge);stroke-width:1.4}.e-fail{stroke:var(--fail-s);stroke-dasharray:5 4}.e-data{stroke:var(--store-s);stroke-dasharray:2 3;stroke-width:1.7}.e-live{stroke:var(--live);stroke-width:2}
.m-flow{fill:var(--edge)}.m-fail{fill:var(--fail-s)}.m-data{fill:var(--store-s)}.m-live{fill:var(--live)}
.frame{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 3}.frame-label{font-size:11px;fill:var(--muted)}
.lane{fill:var(--bg);stroke:var(--line)}.lane-label{font-size:12.5px;font-weight:700;fill:var(--muted);letter-spacing:.04em}.title{font-size:20px;font-weight:700;fill:var(--ink)}.sub{font-size:12.5px;fill:var(--muted)}.bt{font-size:11px;font-weight:700}.b-bad{fill:var(--fail-f);stroke:var(--fail-s);stroke-width:1.6}.bt-bad{fill:var(--fail-s)}.b-ok{fill:var(--out-f);stroke:var(--out-s);stroke-width:1.6}.bt-ok{fill:var(--out-s)}.ph{font-size:13px;font-weight:700;fill:var(--ink)}.pl{font-size:11.5px;fill:var(--ink)}.pm{font-size:11.5px;fill:var(--muted)}</style><rect class="bg" width="1200" height="855" rx="10"/><defs><marker id="cur-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-flow" d="M0 0 L10 5 L0 10 z"/></marker><marker id="cur-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-data" d="M0 0 L10 5 L0 10 z"/></marker><marker id="cur-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-fail" d="M0 0 L10 5 L0 10 z"/></marker><marker id="cur-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-live" d="M0 0 L10 5 L0 10 z"/></marker></defs><text class="title" x="24" y="34">Aryan Assistant: current architecture</text><text class="sub" x="24" y="54">One instance of each service. Red numbers mark what breaks first as traffic grows.</text><rect class="lane" x="20" y="64" width="180" height="576" rx="8"/><text class="lane-label" x="32" y="84">CLIENT</text><rect class="lane" x="215" y="64" width="200" height="576" rx="8"/><text class="lane-label" x="227" y="84">ENTRY</text><rect class="lane" x="430" y="64" width="260" height="576" rx="8"/><text class="lane-label" x="442" y="84">SERVICES</text><rect class="lane" x="705" y="64" width="230" height="576" rx="8"/><text class="lane-label" x="717" y="84">DATA</text><rect class="lane" x="950" y="64" width="230" height="576" rx="8"/><text class="lane-label" x="962" y="84">EXTERNAL APIS</text><path class="e e-live" d="M165 315 H233" marker-end="url(#cur-live)"/><path class="e e-data" d="M345 280 V94 H820 V102" marker-end="url(#cur-data)"/><path class="e" d="M395 315 H422 V142 H453" marker-end="url(#cur-flow)"/><path class="e" d="M422 315 V282 H453" marker-end="url(#cur-flow)"/><path class="e" d="M422 315 V460 H453" marker-end="url(#cur-flow)"/><path class="e e-data" d="M665 130 H728" marker-end="url(#cur-data)"/><path class="e" d="M665 168 H968" marker-end="url(#cur-flow)"/><path class="e e-data" d="M630 174 V214 H790 V248" marker-end="url(#cur-data)"/><path class="e e-data" d="M665 280 H728" marker-end="url(#cur-data)"/><path class="e" d="M560 400 V316" marker-end="url(#cur-flow)"/><path class="e" d="M665 405 H968" marker-end="url(#cur-flow)"/><path class="e" d="M665 490 H968" marker-end="url(#cur-flow)"/><path class="e e-data" d="M600 520 V573 H728" marker-end="url(#cur-data)"/><path class="e e-data" d="M100 350 V618 H820 V603" marker-end="url(#cur-data)"/><rect class="n n-ui" x="35" y="280" width="130" height="70" rx="8"/><text class="t" x="100.0" y="311.0" text-anchor="middle">Browser</text><text class="s" x="100.0" y="328.0" text-anchor="middle">React + Vite SPA</text><rect class="n n-svc" x="235" y="280" width="160" height="70" rx="8"/><text class="t" x="315.0" y="303.5" text-anchor="middle">API gateway</text><text class="s" x="315.0" y="320.5" text-anchor="middle">Express · 1 instance</text><text class="s" x="315.0" y="335.5" text-anchor="middle">session check</text><rect class="n n-svc" x="455" y="110" width="210" height="64" rx="8"/><text class="t" x="560.0" y="138.0" text-anchor="middle">Auth service</text><text class="s" x="560.0" y="155.0" text-anchor="middle">Firebase verify · sessions</text><rect class="n n-svc" x="455" y="250" width="210" height="64" rx="8"/><text class="t" x="560.0" y="278.0" text-anchor="middle">Chat service</text><text class="s" x="560.0" y="295.0" text-anchor="middle">conversations · messages</text><rect class="n n-agent" x="455" y="400" width="210" height="120" rx="8"/><text class="t" x="560.0" y="433.5" text-anchor="middle">Agent service</text><text class="s" x="560.0" y="450.5" text-anchor="middle">LangGraph router → 6 agents</text><text class="s" x="560.0" y="465.5" text-anchor="middle">SSE token streaming</text><text class="s" x="560.0" y="480.5" text-anchor="middle">Puppeteer PDF / PPT</text><text class="s" x="560.0" y="495.5" text-anchor="middle">rendering in-process</text><rect class="n n-store" x="730" y="104" width="180" height="50" rx="8"/><text class="t" x="820.0" y="125.0" text-anchor="middle">Redis</text><text class="s" x="820.0" y="142.0" text-anchor="middle">1 Docker container</text><rect class="n n-store" x="730" y="250" width="180" height="56" rx="8"/><text class="t" x="820.0" y="274.0" text-anchor="middle">MongoDB</text><text class="s" x="820.0" y="291.0" text-anchor="middle">users · chats · messages</text><rect class="n n-store" x="730" y="545" width="180" height="56" rx="8"/><text class="t" x="820.0" y="569.0" text-anchor="middle">AWS S3</text><text class="s" x="820.0" y="586.0" text-anchor="middle">private bucket</text><rect class="n n-ext" x="970" y="140" width="190" height="56" rx="8"/><text class="t" x="1065.0" y="164.0" text-anchor="middle">Firebase Auth</text><text class="s" x="1065.0" y="181.0" text-anchor="middle">Google sign-in</text><rect class="n n-llm" x="970" y="365" width="190" height="70" rx="8"/><text class="t" x="1065.0" y="388.5" text-anchor="middle">LLM providers</text><text class="s" x="1065.0" y="405.5" text-anchor="middle">Groq · Gemini · OpenRouter</text><text class="s" x="1065.0" y="420.5" text-anchor="middle">free-tier keys</text><rect class="n n-ext" x="970" y="460" width="190" height="56" rx="8"/><text class="t" x="1065.0" y="484.0" text-anchor="middle">Tavily · Pollinations</text><text class="s" x="1065.0" y="501.0" text-anchor="middle">web search · images</text><text class="l" x="199" y="305" text-anchor="middle">HTTPS + SSE</text><text class="l" x="600" y="90" text-anchor="middle">session lookup</text><text class="l" x="697" y="124" text-anchor="middle">save session</text><text class="l" x="930" y="184" text-anchor="end">verify token</text><text class="l" x="700" y="209" text-anchor="middle">users</text><text class="l" x="697" y="274" text-anchor="middle">read / write</text><text class="l" x="566" y="362" text-anchor="start">3 blocking calls / msg</text><text class="l" x="820" y="399" text-anchor="middle">prompt + 20-msg history</text><text class="l" x="820" y="484" text-anchor="middle">search · image prompts</text><text class="l" x="665" y="567" text-anchor="middle">upload files</text><text class="l" x="470" y="613" text-anchor="middle">pre-signed file links</text><circle class="b-bad" cx="395" cy="280" r="10"/><text class="bt bt-bad" x="395" y="284" text-anchor="middle">1</text><circle class="b-bad" cx="665" cy="520" r="10"/><text class="bt bt-bad" x="665" y="524" text-anchor="middle">2</text><circle class="b-bad" cx="546" cy="362" r="10"/><text class="bt bt-bad" x="546" y="366" text-anchor="middle">3</text><circle class="b-bad" cx="910" cy="104" r="10"/><text class="bt bt-bad" x="910" y="108" text-anchor="middle">4</text><circle class="b-bad" cx="1160" cy="365" r="10"/><text class="bt bt-bad" x="1160" y="369" text-anchor="middle">5</text><circle class="b-bad" cx="690" cy="405" r="10"/><text class="bt bt-bad" x="690" y="409" text-anchor="middle">6</text><rect class="lane" x="20" y="655" width="1160" height="180" rx="8"/><text class="ph" x="34" y="679">What breaks first at 1 million users</text><circle class="b-bad" cx="44" cy="703" r="9"/><text class="bt bt-bad" x="44" y="707" text-anchor="middle">1</text><text class="pl" x="60" y="707">One gateway and one copy of each service, with no load balancer: a crash or deploy takes everything down.</text><circle class="b-bad" cx="44" cy="725" r="9"/><text class="bt bt-bad" x="44" y="729" text-anchor="middle">2</text><text class="pl" x="60" y="729">Puppeteer runs inside the agent service, so a burst of PDF / PPT jobs uses up CPU and memory for every chat.</text><circle class="b-bad" cx="44" cy="747" r="9"/><text class="bt bt-bad" x="44" y="751" text-anchor="middle">3</text><text class="pl" x="60" y="751">Each message makes 3 blocking HTTP calls to the chat service (load history, save prompt, save reply).</text><circle class="b-bad" cx="44" cy="769" r="9"/><text class="bt bt-bad" x="44" y="773" text-anchor="middle">4</text><text class="pl" x="60" y="773">Redis is one Docker container: if it goes down, no one can log in and every private route fails.</text><circle class="b-bad" cx="44" cy="791" r="9"/><text class="bt bt-bad" x="44" y="795" text-anchor="middle">5</text><text class="pl" x="60" y="795">Free-tier LLM keys with no per-user quotas or failover: one 429 (rate limit) means a failed reply.</text><circle class="b-bad" cx="44" cy="813" r="9"/><text class="bt bt-bad" x="44" y="817" text-anchor="middle">6</text><text class="pl" x="60" y="817">The last 20 messages go to the LLM on every request: token cost grows with every turn.</text></svg>