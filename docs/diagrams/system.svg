<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 650" width="1150" height="650" role="img" aria-label="System map. The browser talks only to the gateway, which checks sessions in Redis and forwards to the auth, chat and agent services. Auth uses Firebase, Redis and MongoDB. Chat uses MongoDB. Agent calls chat directly and calls Groq, OpenRouter, Tavily, Pollinations and S3. The browser loads files from S3 using pre-signed links."><style>svg{--bg:#f3f5f7;--panel:#ffffff;--ink:#17212b;--muted:#55636f;--line:#cdd5dc;--edge:#3f4d59;--ui-f:#e4eefb;--ui-s:#2a64b8;--svc-f:#e9ecf1;--svc-s:#3f4d59;--llm-f:#efe9fb;--llm-s:#6a3fc0;--ext-f:#fcf1da;--ext-s:#9a6400;--store-f:#dff2ef;--store-s:#0d7168;--out-f:#e6f3e0;--out-s:#3c7a27;--fail-f:#fcebe9;--fail-s:#b3261e;--live:#2a64b8;}@media (prefers-color-scheme:dark){svg{--bg:#11161b;--panel:#1a2128;--ink:#e7ecf0;--muted:#a0adb8;--line:#36424d;--edge:#a7b4bf;--ui-f:#15283f;--ui-s:#7baef0;--svc-f:#242c34;--svc-s:#a7b4bf;--llm-f:#2a2145;--llm-s:#ad90f2;--ext-f:#33280f;--ext-s:#deb159;--store-f:#10302e;--store-s:#55c6ba;--out-f:#1b2f15;--out-s:#8dcb75;--fail-f:#3a1816;--fail-s:#f28d85;--live:#7baef0;}}
.bg{fill:var(--panel)}text{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.n{stroke-width:1.4}.n-ui{fill:var(--ui-f);stroke:var(--ui-s)}.n-svc,.n-agent,.n-graph{fill:var(--svc-f);stroke:var(--svc-s)}.n-agent,.n-graph{stroke-width:2}
.n-step{fill:var(--panel);stroke:var(--edge)}.n-dec{fill:var(--panel);stroke:var(--ink);stroke-width:1.6}.n-llm{fill:var(--llm-f);stroke:var(--llm-s)}.n-ext{fill:var(--ext-f);stroke:var(--ext-s)}.n-store{fill:var(--store-f);stroke:var(--store-s)}.n-out{fill:var(--out-f);stroke:var(--out-s)}.n-fail{fill:var(--fail-f);stroke:var(--fail-s);stroke-dasharray:4 3}.n-pill{fill:var(--ink);stroke:var(--ink)}
.t{font-size:13px;font-weight:600;fill:var(--ink)}.s{font-size:11.5px;fill:var(--muted)}.n-pill + .t{fill:var(--bg)}
.l{font-size:11px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.l-fail{fill:var(--fail-s)}
.e{fill:none;stroke:var(--edge);stroke-width:1.4}.e-fail{stroke:var(--fail-s);stroke-dasharray:5 4}.e-data{stroke:var(--store-s);stroke-dasharray:2 3;stroke-width:1.7}.e-live{stroke:var(--live);stroke-width:2}
.m-flow{fill:var(--edge)}.m-fail{fill:var(--fail-s)}.m-data{fill:var(--store-s)}.m-live{fill:var(--live)}
.frame{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 3}.frame-label{font-size:11px;fill:var(--muted)}
.lane{fill:var(--bg);stroke:var(--line)}.lane-label{font-size:12.5px;font-weight:700;fill:var(--muted);letter-spacing:.04em}</style><rect class="bg" width="1150" height="650" rx="10"/><defs><marker id="d7-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-flow" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d7-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-data" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d7-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-fail" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d7-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-live" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="frame" x="690" y="485" width="415" height="150" rx="10"/><text class="frame-label" x="702" y="502">External services called by the agent service</text><path class="e e-data" d="M810 65 L1123 65 Q1130 65 1130 72 L1130 592 Q1130 599 1123 599 L1093 599" marker-end="url(#d7-data)"/><path class="e e-flow" d="M950 419 L950 445 Q950 452 943 452 L904.5 452 Q897.5 452 897.5 459 L897.5 485" marker-end="url(#d7-flow)"/><path class="e e-flow" d="M830 377 L710 377" marker-end="url(#d7-flow)"/><path class="e e-flow" d="M590 419 L590.0024 510" marker-end="url(#d7-flow)"/><path class="e e-flow" d="M190 419 L190.00009999999997 510" marker-end="url(#d7-flow)"/><path class="e e-flow" d="M70 377 L41 377 Q34 377 34 370 L34 72 Q34 65 41 65 L70 65" marker-end="url(#d7-flow)"/><path class="e e-flow" d="M170.00008 335 L170 245" marker-end="url(#d7-flow)"/><path class="e e-flow" d="M766 245 L766 283 Q766 290 773 290 L943 290 Q950 290 950 297 L950 335" marker-end="url(#d7-flow)"/><path class="e e-flow" d="M590 245 L590 335" marker-end="url(#d7-flow)"/><path class="e e-flow" d="M414 245 L414 283 Q414 290 407 290 L269 290 Q262 290 262 297 L262 335" marker-end="url(#d7-flow)"/><path class="e e-flow" d="M370 210 L270 210" marker-end="url(#d7-flow)"/><path class="e e-flow" d="M590 100 L590 175" marker-end="url(#d7-flow)"/><path class="e e-flow" d="M370 65 L270 65" marker-end="url(#d7-flow)"/><rect class="n n-ext" x="70" y="30" width="200" height="70" rx="7"/><text class="t" x="170" y="61.75" text-anchor="middle">Firebase Auth</text><text class="s" x="170" y="76.75" text-anchor="middle">Google sign-in, issues ID tokens</text><rect class="n n-ui" x="370" y="30" width="440" height="70" rx="7"/><text class="t" x="590" y="61.75" text-anchor="middle">Browser: React app (:5173)</text><text class="s" x="590" y="76.75" text-anchor="middle">Home, ChatArea, SideBar, Artifact panel, Redux user slice</text><rect class="n n-store" x="70" y="175" width="200" height="70" rx="7"/><text class="t" x="170" y="206.75" text-anchor="middle">Redis (:6379)</text><text class="s" x="170" y="221.75" text-anchor="middle">session:&lt;id&gt;, 7-day expiry</text><rect class="n n-svc" x="370" y="175" width="440" height="70" rx="7"/><text class="t" x="590" y="206.75" text-anchor="middle">API gateway (:8000)</text><text class="s" x="590" y="221.75" text-anchor="middle">CORS, cookies, protect middleware, adds x-user-id and x-user-name</text><rect class="n n-svc" x="70" y="335" width="240" height="84" rx="7"/><text class="t" x="190" y="366.5" text-anchor="middle">Auth service (:8001)</text><text class="s" x="190" y="381.5" text-anchor="middle">login, logout, verifies tokens,</text><text class="s" x="190" y="396" text-anchor="middle">creates sessions</text><rect class="n n-svc" x="470" y="335" width="240" height="84" rx="7"/><text class="t" x="590" y="373.75" text-anchor="middle">Chat service (:8002)</text><text class="s" x="590" y="388.75" text-anchor="middle">conversations and messages</text><rect class="n n-svc" x="830" y="335" width="240" height="84" rx="7"/><text class="t" x="950" y="366.5" text-anchor="middle">Agent service (:8003)</text><text class="s" x="950" y="381.5" text-anchor="middle">LangGraph: router and six agents, SSE</text><text class="s" x="950" y="396" text-anchor="middle">stream, file links</text><rect class="n n-store" x="70" y="510" width="590" height="70" rx="7"/><text class="t" x="365" y="541.75" text-anchor="middle">MongoDB</text><text class="s" x="365" y="556.75" text-anchor="middle">users, conversations, messages</text><rect class="n n-ext" x="702" y="510" width="125" height="54" rx="7"/><text class="t" x="764.5" y="533.75" text-anchor="middle">Groq</text><text class="s" x="764.5" y="548.75" text-anchor="middle">most agents</text><rect class="n n-ext" x="835" y="510" width="125" height="54" rx="7"/><text class="t" x="897.5" y="533.75" text-anchor="middle">OpenRouter</text><text class="s" x="897.5" y="548.75" text-anchor="middle">coding agent</text><rect class="n n-ext" x="968" y="510" width="125" height="54" rx="7"/><text class="t" x="1030.5" y="533.75" text-anchor="middle">Tavily</text><text class="s" x="1030.5" y="548.75" text-anchor="middle">web results</text><rect class="n n-ext" x="702" y="572" width="258" height="54" rx="7"/><text class="t" x="831" y="595.75" text-anchor="middle">Pollinations.ai</text><text class="s" x="831" y="610.75" text-anchor="middle">image generation (flux by default)</text><rect class="n n-store" x="968" y="572" width="125" height="54" rx="7"/><text class="t" x="1030.5" y="595.75" text-anchor="middle">AWS S3</text><text class="s" x="1030.5" y="610.75" text-anchor="middle">private files</text><text class="l" x="320" y="45" text-anchor="middle">popup,</text><text class="l" x="320" y="58" text-anchor="middle">ID token</text><text class="l" x="598" y="142" text-anchor="start">every /api call, with session cookie</text><text class="l" x="320" y="189" text-anchor="middle">GET</text><text class="l" x="320" y="202" text-anchor="middle">session</text><text class="l" x="330" y="270" text-anchor="middle">/api/auth/*</text><text class="l" x="330" y="283" text-anchor="middle">no session check</text><text class="l" x="598" y="320" text-anchor="start">/api/chat/*, x-user-id</text><text class="l" x="880" y="270" text-anchor="middle">/api/agent/*</text><text class="l" x="880" y="283" text-anchor="middle">x-user-id, x-user-name</text><text class="l" x="178" y="277" text-anchor="start">SET, DEL</text><text class="l" x="178" y="290" text-anchor="start">session</text><text class="l" x="42" y="150" text-anchor="start">verifyIdToken</text><text class="l" x="198" y="470" text-anchor="start">users</text><text class="l" x="582" y="470" text-anchor="end">conversations, messages</text><text class="l" x="770" y="359" text-anchor="middle">get-messages,</text><text class="l" x="770" y="372" text-anchor="middle">save-messages</text><text class="l" x="958" y="446" text-anchor="start">HTTPS calls</text><text class="l" x="1120" y="197" text-anchor="end">302 to pre-signed link:</text><text class="l" x="1120" y="210" text-anchor="end">browser reads the file directly</text></svg>
