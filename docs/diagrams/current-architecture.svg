<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1110" width="1150" height="1110" role="img" aria-label="Current architecture, laid out like the 1-million-user design. Edge: users load the React app and call the gateway directly, with no load balancer or rate limits. Services: one copy each of the gateway, auth, chat and agent services. Agent work runs inside the agent service process: LangGraph, Puppeteer and token streaming all happen in the request, with no queue. Data: one Redis container, one MongoDB database and a private S3 bucket. External: Firebase, Groq and OpenRouter called directly with single keys, plus Tavily and Pollinations."><style>svg{--bg:#f3f5f7;--panel:#ffffff;--ink:#17212b;--muted:#55636f;--line:#cdd5dc;--edge:#3f4d59;--ui-f:#e4eefb;--ui-s:#2a64b8;--svc-f:#e9ecf1;--svc-s:#3f4d59;--llm-f:#efe9fb;--llm-s:#6a3fc0;--ext-f:#fcf1da;--ext-s:#9a6400;--store-f:#dff2ef;--store-s:#0d7168;--out-f:#e6f3e0;--out-s:#3c7a27;--fail-f:#fcebe9;--fail-s:#b3261e;--live:#2a64b8;}@media (prefers-color-scheme:dark){svg{--bg:#11161b;--panel:#1a2128;--ink:#e7ecf0;--muted:#a0adb8;--line:#36424d;--edge:#a7b4bf;--ui-f:#15283f;--ui-s:#7baef0;--svc-f:#242c34;--svc-s:#a7b4bf;--llm-f:#2a2145;--llm-s:#ad90f2;--ext-f:#33280f;--ext-s:#deb159;--store-f:#10302e;--store-s:#55c6ba;--out-f:#1b2f15;--out-s:#8dcb75;--fail-f:#3a1816;--fail-s:#f28d85;--live:#7baef0;}}
.bg{fill:var(--panel)}text{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.n{stroke-width:1.4}.n-ui{fill:var(--ui-f);stroke:var(--ui-s)}.n-svc,.n-agent,.n-graph{fill:var(--svc-f);stroke:var(--svc-s)}.n-agent,.n-graph{stroke-width:2}
.n-step{fill:var(--panel);stroke:var(--edge)}.n-dec{fill:var(--panel);stroke:var(--ink);stroke-width:1.6}.n-llm{fill:var(--llm-f);stroke:var(--llm-s)}.n-ext{fill:var(--ext-f);stroke:var(--ext-s)}.n-store{fill:var(--store-f);stroke:var(--store-s)}.n-out{fill:var(--out-f);stroke:var(--out-s)}.n-fail{fill:var(--fail-f);stroke:var(--fail-s);stroke-dasharray:4 3}.n-pill{fill:var(--ink);stroke:var(--ink)}
.t{font-size:13px;font-weight:600;fill:var(--ink)}.s{font-size:11.5px;fill:var(--muted)}.n-pill + .t{fill:var(--bg)}
.l{font-size:11px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.l-fail{fill:var(--fail-s)}
.e{fill:none;stroke:var(--edge);stroke-width:1.4}.e-fail{stroke:var(--fail-s);stroke-dasharray:5 4}.e-data{stroke:var(--store-s);stroke-dasharray:2 3;stroke-width:1.7}.e-live{stroke:var(--live);stroke-width:2}
.m-flow{fill:var(--edge)}.m-fail{fill:var(--fail-s)}.m-data{fill:var(--store-s)}.m-live{fill:var(--live)}
.frame{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 3}.frame-label{font-size:11px;fill:var(--muted)}
.lane{fill:var(--bg);stroke:var(--line)}.lane-label{font-size:12.5px;font-weight:700;fill:var(--muted);letter-spacing:.04em}</style><rect class="bg" width="1150" height="1110" rx="10"/><defs><marker id="d22-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-flow" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d22-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-data" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d22-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-fail" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d22-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-live" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="lane" x="16" y="70" width="1118" height="150" rx="10"/><text class="lane-label" x="28" y="88">EDGE</text><rect class="lane" x="16" y="236" width="1118" height="186" rx="10"/><text class="lane-label" x="28" y="254">SERVICES  ·  Node.js + Express, one process each</text><rect class="lane" x="16" y="438" width="1118" height="196" rx="10"/><text class="lane-label" x="28" y="456">AGENT WORK  ·  runs inside the agent service, during the request</text><rect class="lane" x="16" y="650" width="1118" height="178" rx="10"/><text class="lane-label" x="28" y="668">DATA</text><rect class="lane" x="16" y="844" width="1118" height="150" rx="10"/><text class="lane-label" x="28" y="862">EXTERNAL PROVIDERS</text><path class="e e-flow" d="M210 130 L270 123" marker-end="url(#d22-flow)"/><path class="e e-flow" d="M210 168 L270 183" marker-end="url(#d22-flow)"/><path class="e e-flow" d="M125 186 L125 300" marker-end="url(#d22-flow)"/><path class="e e-flow" d="M290 337 L312 337" marker-end="url(#d22-flow)"/><path class="e e-flow" d="M165 374 L165 385 Q165 392 172 392 L702 392 Q709 392 709 385 L709 374" marker-end="url(#d22-flow)"/><path class="e e-flow" d="M165 374 L165 385 Q165 392 172 392 L974 392 Q981 392 981 385 L981 374" marker-end="url(#d22-flow)"/><path class="e e-flow" d="M900 374 L900 413 Q900 420 893 420 L767 420 Q760 420 760 427 L760 470" marker-end="url(#d22-flow)"/><path class="e e-flow" d="M760 532 L760 548" marker-end="url(#d22-flow)"/><path class="e e-live" d="M870 501 L910 501" marker-end="url(#d22-live)"/><path class="e e-live" d="M1015 478 L1015 374" marker-end="url(#d22-live)"/><path class="e e-data" d="M165 374 L165 690" marker-end="url(#d22-data)"/><path class="e e-data" d="M605 374 L605 690" marker-end="url(#d22-data)"/><path class="e e-data" d="M850 610 L850 633 Q850 640 857 640 L1008 640 Q1015 640 1015 647 L1015 690" marker-end="url(#d22-data)"/><path class="e e-flow" d="M700 610 L700 884" marker-end="url(#d22-flow)"/><path class="e e-flow" d="M820 610 L820 853 Q820 860 827 860 L1013 860 Q1020 860 1020 867 L1020 884" marker-end="url(#d22-flow)"/><rect class="n n-ui" x="40" y="112" width="170" height="74" rx="7"/><text class="t" x="125.0" y="145.2" text-anchor="middle">Users</text><text class="s" x="125.0" y="161.2" text-anchor="middle">browser, React app</text><rect class="n n-ext" x="270" y="100" width="200" height="46" rx="7"/><text class="t" x="370.0" y="119.2" text-anchor="middle">Vite / static build</text><text class="s" x="370.0" y="135.2" text-anchor="middle">React, Tailwind, Redux</text><rect class="n n-ext" x="270" y="160" width="200" height="46" rx="7"/><text class="t" x="370.0" y="179.2" text-anchor="middle">File links</text><text class="s" x="370.0" y="195.2" text-anchor="middle">redirect to pre-signed S3 URL</text><rect class="n n-fail" x="540" y="104" width="260" height="90" rx="7"/><text class="t" x="670.0" y="130.8" text-anchor="middle">No load balancer or WAF</text><text class="s" x="670.0" y="146.8" text-anchor="middle">browser calls the gateway directly</text><text class="s" x="670.0" y="161.2" text-anchor="middle">no rate limits, no bot filter</text><text class="s" x="670.0" y="175.8" text-anchor="middle">one gateway = single point of failure</text><rect class="n n-svc" x="40" y="300" width="250" height="74" rx="7"/><text class="t" x="165.0" y="326.0" text-anchor="middle">gateway ×1  :8000</text><text class="s" x="165.0" y="342.0" text-anchor="middle">session check (protect),</text><text class="s" x="165.0" y="356.5" text-anchor="middle">adds x-user-id</text><rect class="n n-svc" x="312" y="300" width="250" height="74" rx="7"/><text class="t" x="437.0" y="326.0" text-anchor="middle">auth ×1  :8001</text><text class="s" x="437.0" y="342.0" text-anchor="middle">Firebase verify,</text><text class="s" x="437.0" y="356.5" text-anchor="middle">session create/delete</text><rect class="n n-svc" x="584" y="300" width="250" height="74" rx="7"/><text class="t" x="709.0" y="326.0" text-anchor="middle">chat ×1  :8002</text><text class="s" x="709.0" y="342.0" text-anchor="middle">conversations,</text><text class="s" x="709.0" y="356.5" text-anchor="middle">messages</text><rect class="n n-svc" x="856" y="300" width="250" height="74" rx="7"/><text class="t" x="981.0" y="326.0" text-anchor="middle">agent ×1  :8003</text><text class="s" x="981.0" y="342.0" text-anchor="middle">holds the SSE stream AND</text><text class="s" x="981.0" y="356.5" text-anchor="middle">runs the whole graph</text><rect class="n n-fail" x="360" y="478" width="230" height="74" rx="7"/><text class="t" x="475.0" y="504.0" text-anchor="middle">No job queue</text><text class="s" x="475.0" y="520.0" text-anchor="middle">the run happens inside the</text><text class="s" x="475.0" y="534.5" text-anchor="middle">HTTP request; no retries</text><rect class="n n-agent" x="650" y="470" width="220" height="62" rx="7"/><text class="t" x="760.0" y="497.2" text-anchor="middle">LangGraph in-process</text><text class="s" x="760.0" y="513.2" text-anchor="middle">router, chat, search, coding</text><rect class="n n-agent" x="650" y="548" width="220" height="62" rx="7"/><text class="t" x="760.0" y="575.2" text-anchor="middle">Puppeteer in-process</text><text class="s" x="760.0" y="591.2" text-anchor="middle">pdf, ppt; imageGen upload</text><rect class="n n-out" x="910" y="478" width="210" height="74" rx="7"/><text class="t" x="1015.0" y="504.0" text-anchor="middle">SSE response</text><text class="s" x="1015.0" y="520.0" text-anchor="middle">tokens written straight</text><text class="s" x="1015.0" y="534.5" text-anchor="middle">to this one connection</text><path class="n n-store" d="M40 698 A125.0 8 0 0 1 290 698 L290 792 A125.0 8 0 0 1 40 792 Z"/><path class="n n-store" d="M40 698 A125.0 8 0 0 0 290 698" fill="none"/><text class="t" x="165.0" y="730.8" text-anchor="middle">Redis ×1</text><text class="s" x="165.0" y="746.8" text-anchor="middle">Docker container</text><text class="s" x="165.0" y="761.2" text-anchor="middle">session:&lt;id&gt;, 7 days</text><text class="s" x="165.0" y="775.8" text-anchor="middle">no replica</text><path class="n n-store" d="M330 698 A150.0 8 0 0 1 630 698 L630 792 A150.0 8 0 0 1 330 792 Z"/><path class="n n-store" d="M330 698 A150.0 8 0 0 0 630 698" fill="none"/><text class="t" x="480.0" y="730.8" text-anchor="middle">MongoDB ×1</text><text class="s" x="480.0" y="746.8" text-anchor="middle">one database</text><text class="s" x="480.0" y="761.2" text-anchor="middle">users, conversations,</text><text class="s" x="480.0" y="775.8" text-anchor="middle">messages; no sharding</text><path class="n n-store" d="M910 698 A105.0 8 0 0 1 1120 698 L1120 792 A105.0 8 0 0 1 910 792 Z"/><path class="n n-store" d="M910 698 A105.0 8 0 0 0 1120 698" fill="none"/><text class="t" x="1015.0" y="738.0" text-anchor="middle">S3 bucket</text><text class="s" x="1015.0" y="754.0" text-anchor="middle">private</text><text class="s" x="1015.0" y="768.5" text-anchor="middle">files owned per user</text><rect class="n n-ext" x="40" y="884" width="250" height="90" rx="7"/><text class="t" x="165.0" y="918.0" text-anchor="middle">Firebase Auth</text><text class="s" x="165.0" y="934.0" text-anchor="middle">Google sign-in,</text><text class="s" x="165.0" y="948.5" text-anchor="middle">verified by the auth service</text><rect class="n n-llm" x="620" y="884" width="270" height="90" rx="7"/><text class="t" x="755.0" y="910.8" text-anchor="middle">Groq + OpenRouter</text><text class="s" x="755.0" y="926.8" text-anchor="middle">called directly, one key each</text><text class="s" x="755.0" y="941.2" text-anchor="middle">no failover between providers</text><text class="s" x="755.0" y="955.8" text-anchor="middle">free-tier rate limits</text><rect class="n n-ext" x="920" y="884" width="200" height="90" rx="7"/><text class="t" x="1020.0" y="918.0" text-anchor="middle">Tools</text><text class="s" x="1020.0" y="934.0" text-anchor="middle">Tavily web search</text><text class="s" x="1020.0" y="948.5" text-anchor="middle">Pollinations: 1 image / 45 s free</text><text class="t" x="20" y="34" text-anchor="start">Step 1 · Current architecture of Aryan&#x27;s Assistant</text><text class="s" x="20" y="54" text-anchor="start">One copy of each service on one machine. Red dashed boxes are the gaps that step 2 fixes.</text><text class="l" x="240" y="112" text-anchor="middle">① app</text><text class="l" x="133" y="207" text-anchor="start">② /api + cookie</text><text class="l" x="440" y="388" text-anchor="middle">③ verified request</text><text class="s" x="312" y="290" text-anchor="start">Sessions live in Redis, so a restart doesn&#x27;t log users out</text><text class="l" x="830" y="416" text-anchor="middle">④ run graph</text><text class="l" x="1023" y="440" text-anchor="start">⑦ tokens</text><text class="s" x="190" y="584" text-anchor="start">Long runs and Chromium share CPU and memory</text><text class="s" x="190" y="600" text-anchor="start">with every other user&#x27;s request.</text><text class="l" x="173" y="660" text-anchor="start">sessions</text><text class="l" x="598" y="660" text-anchor="end">⑧ save reply</text><text class="l" x="935" y="634" text-anchor="middle">⑨ files</text><text class="l" x="708" y="760" text-anchor="start">⑥ LLM calls</text><text class="l" x="930" y="854" text-anchor="middle">search, images</text><text class="t" x="20" y="1018" text-anchor="start">What limits it today</text><text class="s" x="20" y="1040" text-anchor="start">• Every service is a single process: if one crashes or is redeployed, that part of the app is down.</text><text class="s" x="20" y="1057" text-anchor="start">• Agent runs, Puppeteer and the SSE stream all live in one agent process, so a few heavy requests slow everyone down.</text><text class="s" x="20" y="1074" text-anchor="start">• One Redis container and one MongoDB database hold all sessions and chats, with no replicas or sharding.</text><text class="s" x="20" y="1091" text-anchor="start">• Provider keys and free tiers cap throughput; there are no per-user quotas, no rate limits and no monitoring.</text></svg>
