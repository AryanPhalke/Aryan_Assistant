<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 518" width="670" height="518" role="img" aria-label="Chat agent flow: builds a system prompt, adds web results if search ran, calls the LLM with history and returns the reply. On error it returns an apology."><style>svg{--bg:#f3f5f7;--panel:#ffffff;--ink:#17212b;--muted:#55636f;--line:#cdd5dc;--edge:#3f4d59;--ui-f:#e4eefb;--ui-s:#2a64b8;--svc-f:#e9ecf1;--svc-s:#3f4d59;--llm-f:#efe9fb;--llm-s:#6a3fc0;--ext-f:#fcf1da;--ext-s:#9a6400;--store-f:#dff2ef;--store-s:#0d7168;--out-f:#e6f3e0;--out-s:#3c7a27;--fail-f:#fcebe9;--fail-s:#b3261e;--live:#2a64b8;}@media (prefers-color-scheme:dark){svg{--bg:#11161b;--panel:#1a2128;--ink:#e7ecf0;--muted:#a0adb8;--line:#36424d;--edge:#a7b4bf;--ui-f:#15283f;--ui-s:#7baef0;--svc-f:#242c34;--svc-s:#a7b4bf;--llm-f:#2a2145;--llm-s:#ad90f2;--ext-f:#33280f;--ext-s:#deb159;--store-f:#10302e;--store-s:#55c6ba;--out-f:#1b2f15;--out-s:#8dcb75;--fail-f:#3a1816;--fail-s:#f28d85;--live:#7baef0;}}
.bg{fill:var(--panel)}text{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.n{stroke-width:1.4}.n-ui{fill:var(--ui-f);stroke:var(--ui-s)}.n-svc,.n-agent,.n-graph{fill:var(--svc-f);stroke:var(--svc-s)}.n-agent,.n-graph{stroke-width:2}
.n-step{fill:var(--panel);stroke:var(--edge)}.n-dec{fill:var(--panel);stroke:var(--ink);stroke-width:1.6}.n-llm{fill:var(--llm-f);stroke:var(--llm-s)}.n-ext{fill:var(--ext-f);stroke:var(--ext-s)}.n-store{fill:var(--store-f);stroke:var(--store-s)}.n-out{fill:var(--out-f);stroke:var(--out-s)}.n-fail{fill:var(--fail-f);stroke:var(--fail-s);stroke-dasharray:4 3}.n-pill{fill:var(--ink);stroke:var(--ink)}
.t{font-size:13px;font-weight:600;fill:var(--ink)}.s{font-size:11.5px;fill:var(--muted)}.n-pill + .t{fill:var(--bg)}
.l{font-size:11px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.l-fail{fill:var(--fail-s)}
.e{fill:none;stroke:var(--edge);stroke-width:1.4}.e-fail{stroke:var(--fail-s);stroke-dasharray:5 4}.e-data{stroke:var(--store-s);stroke-dasharray:2 3;stroke-width:1.7}.e-live{stroke:var(--live);stroke-width:2}
.m-flow{fill:var(--edge)}.m-fail{fill:var(--fail-s)}.m-data{fill:var(--store-s)}.m-live{fill:var(--live)}
.frame{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 3}.frame-label{font-size:11px;fill:var(--muted)}
.lane{fill:var(--bg);stroke:var(--line)}.lane-label{font-size:12.5px;font-weight:700;fill:var(--muted);letter-spacing:.04em}</style><rect class="bg" width="670" height="518" rx="10"/><defs><marker id="d1-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-flow" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d1-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-data" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d1-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-fail" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d1-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-live" d="M0 0 L10 5 L0 10 z"/></marker></defs><path class="e e-fail" d="M535 320 L535 452 Q535 459 528 459 L280 459" marker-end="url(#d1-fail)"/><path class="e e-flow" d="M180 404 L180 438" marker-end="url(#d1-flow)"/><path class="e e-flow" d="M180 320 L180 346" marker-end="url(#d1-flow)"/><path class="e e-fail" d="M340 291 L430 291" marker-end="url(#d1-fail)"/><path class="e e-flow" d="M535 236 L535 242.5 Q535 249 528.5 249 L298.5 249 Q292 249 292 255.5 L292 262" marker-end="url(#d1-flow)"/><path class="e e-flow" d="M340 207 L430 207" marker-end="url(#d1-flow)"/><path class="e e-flow" d="M180 236 L180 262" marker-end="url(#d1-flow)"/><path class="e e-flow" d="M180 152 L180 178" marker-end="url(#d1-flow)"/><path class="e e-flow" d="M180 60 L180 94" marker-end="url(#d1-flow)"/><rect class="n n-pill" x="80" y="18" width="200" height="42" rx="21"/><text class="t" x="180" y="43" text-anchor="middle">From router or search</text><rect class="n n-step" x="20" y="94" width="320" height="58" rx="7"/><text class="t" x="180" y="119.75" text-anchor="middle">Build system prompt</text><text class="s" x="180" y="134.75" text-anchor="middle">AryanAI persona, plus the user's name</text><polygon class="n n-dec" points="36,178 324,178 340,207 324,236 36,236 20,207"/><text class="t" x="180" y="211" text-anchor="middle">state.searchResults set?</text><rect class="n n-step" x="430" y="178" width="210" height="58" rx="7"/><text class="t" x="535" y="203.75" text-anchor="middle">Append web results</text><text class="s" x="535" y="218.75" text-anchor="middle">date, sources, marked untrusted</text><rect class="n n-llm" x="20" y="262" width="320" height="58" rx="7"/><text class="t" x="180" y="287.75" text-anchor="middle">Call the LLM</text><text class="s" x="180" y="302.75" text-anchor="middle">system prompt, up to 20 messages, new prompt</text><rect class="n n-fail" x="430" y="262" width="210" height="58" rx="7"/><text class="t" x="535" y="287.75" text-anchor="middle">Apology as the reply</text><text class="s" x="535" y="302.75" text-anchor="middle">“couldn't generate a response”</text><rect class="n n-out" x="20" y="346" width="320" height="58" rx="7"/><text class="t" x="180" y="371.75" text-anchor="middle">Set aiResponse</text><text class="s" x="180" y="386.75" text-anchor="middle">tokens reach the browser as they arrive</text><rect class="n n-pill" x="80" y="438" width="200" height="42" rx="21"/><text class="t" x="180" y="463" text-anchor="middle">END</text><text class="l" x="188" y="253" text-anchor="start">no</text><text class="l" x="385" y="201" text-anchor="middle">yes</text><text class="l l-fail" x="385" y="285" text-anchor="middle">throws</text></svg>
