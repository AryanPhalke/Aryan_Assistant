" text-anchor="middle">gpt-oss-20b, temperature 0</text><polygon class="n n-dec" points="364,176 528,176 544,211 528,246 364,246 348,211"/><text class="t" x="446" y="207" text-anchor="middle">Reply is an agent</text><text class="t" x="446" y="223" text-anchor="middle">name?</text><rect class="n n-fail" x="108" y="300" width="196" height="62" rx="7"/><text class="t" x="206" y="327.75" text-anchor="middle">Fall back to chat</text><text class="s" x="206" y="342.75" text-anchor="middle">also on an LLM error</text><rect class="n n-step" x="348" y="300" width="196" height="62" rx="7"/><text class="t" x="446" y="335" text-anchor="middle">Set state.agent</text><polygon class="n n-dec" points="604,296 690,296 706,331 690,366 604,366 588,331"/><text class="t" x="647" y="335" text-anchor="middle">switch</text><rect class="n n-agent" x="786" y="22" width="230" height="66" rx="7"/><text class="t" x="901" y="51.75" text-anchor="middle">coding</text><text class="s" x="901" y="66.75" text-anchor="middle">OpenRouter, tokens stream live</text><rect class="n n-agent" x="786" y="104" width="230" height="66" rx="7"/><text class="t" x="901" y="126.5" text-anchor="middle">pdf</text><text class="s" x="901" y="141.5" text-anchor="middle">Groq, Puppeteer, S3; link in one</text><text class="s" x="901" y="156" text-anchor="middle">piece</text><rect class="n n-agent" x="786" y="186" width="230" height="66" rx="7"/><text class="t" x="901" y="208.5" text-anchor="middle">ppt</text><text class="s" x="901" y="223.5" text-anchor="middle">Groq, PptxGenJS, Puppeteer, S3; one</text><text class="s" x="901" y="238" text-anchor="middle">piece</text><rect class="n n-agent" x="786" y="268" width="230" height="66" rx="7"/><text class="t" x="901" y="297.75" text-anchor="middle">imageGen</text><text class="s" x="901" y="312.75" text-anchor="middle">Groq, Pollinations, S3; one piece</text><rect class="n n-agent" x="786" y="350" width="230" height="66" rx="7"/><text class="t" x="901" y="379.75" text-anchor="middle">search</text><text class="s" x="901" y="394.75" text-anchor="middle">Groq, Tavily; sends no reply itself</text><rect class="n n-agent" x="786" y="432" width="230" height="66" rx="7"/><text class="t" x="901" y="461.75" text-anchor="middle">chat</text><text class="s" x="901" y="476.75" text-anchor="middle">Groq, tokens stream live</text><rect class="n n-pill" x="1072" y="214" width="62" height="46" rx="23"/><text class="t" x="1103" y="241" text-anchor="middle">END</text><text class="l" x="326" y="91" text-anchor="middle">yes</text><text class="l" x="214" y="158" text-anchor="start">no</text><text class="l" x="454" y="277" text-anchor="start">yes</text><text class="l l-fail" x="300" y="268" text-anchor="middle">no</text><text class="l" x="909" y="427" text-anchor="start">searchResults</text></svg>
