<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 980" width="1130" height="980" role="img" aria-label="Swimlane flowchart of one message moving from the browser through the gateway and agent service, with reads and writes to the chat service, and streamed events back to the browser."><style>svg{--bg:#f3f5f7;--panel:#ffffff;--ink:#17212b;--muted:#55636f;--line:#cdd5dc;--edge:#3f4d59;--ui-f:#e4eefb;--ui-s:#2a64b8;--svc-f:#e9ecf1;--svc-s:#3f4d59;--llm-f:#efe9fb;--llm-s:#6a3fc0;--ext-f:#fcf1da;--ext-s:#9a6400;--store-f:#dff2ef;--store-s:#0d7168;--out-f:#e6f3e0;--out-s:#3c7a27;--fail-f:#fcebe9;--fail-s:#b3261e;--live:#2a64b8;}@media (prefers-color-scheme:dark){svg{--bg:#11161b;--panel:#1a2128;--ink:#e7ecf0;--muted:#a0adb8;--line:#36424d;--edge:#a7b4bf;--ui-f:#15283f;--ui-s:#7baef0;--svc-f:#242c34;--svc-s:#a7b4bf;--llm-f:#2a2145;--llm-s:#ad90f2;--ext-f:#33280f;--ext-s:#deb159;--store-f:#10302e;--store-s:#55c6ba;--out-f:#1b2f15;--out-s:#8dcb75;--fail-f:#3a1816;--fail-s:#f28d85;--live:#7baef0;}}
.bg{fill:var(--panel)}text{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.n{stroke-width:1.4}.n-ui{fill:var(--ui-f);stroke:var(--ui-s)}.n-svc,.n-agent,.n-graph{fill:var(--svc-f);stroke:var(--svc-s)}.n-agent,.n-graph{stroke-width:2}
.n-step{fill:var(--panel);stroke:var(--edge)}.n-dec{fill:var(--panel);stroke:var(--ink);stroke-width:1.6}.n-llm{fill:var(--llm-f);stroke:var(--llm-s)}.n-ext{fill:var(--ext-f);stroke:var(--ext-s)}.n-store{fill:var(--store-f);stroke:var(--store-s)}.n-out{fill:var(--out-f);stroke:var(--out-s)}.n-fail{fill:var(--fail-f);stroke:var(--fail-s);stroke-dasharray:4 3}.n-pill{fill:var(--ink);stroke:var(--ink)}
.t{font-size:13px;font-weight:600;fill:var(--ink)}.s{font-size:11.5px;fill:var(--muted)}.n-pill + .t{fill:var(--bg)}
.l{font-size:11px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.l-fail{fill:var(--fail-s)}
.e{fill:none;stroke:var(--edge);stroke-width:1.4}.e-fail{stroke:var(--fail-s);stroke-dasharray:5 4}.e-data{stroke:var(--store-s);stroke-dasharray:2 3;stroke-width:1.7}.e-live{stroke:var(--live);stroke-width:2}
.m-flow{fill:var(--edge)}.m-fail{fill:var(--fail-s)}.m-data{fill:var(--store-s)}.m-live{fill:var(--live)}
.frame{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 3}.frame-label{font-size:11px;fill:var(--muted)}
.lane{fill:var(--bg);stroke:var(--line)}.lane-label{font-size:12.5px;font-weight:700;fill:var(--muted);letter-spacing:.04em}</style><rect class="bg" width="1130" height="980" rx="10"/><defs><marker id="d8-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-flow" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d8-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-data" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d8-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-fail" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d8-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-live" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="lane" x="10" y="6" width="290" height="968" rx="8"/><text class="lane-label" x="155" y="27" text-anchor="middle">Browser</text><rect class="lane" x="308" y="6" width="262" height="968" rx="8"/><text class="lane-label" x="439" y="27" text-anchor="middle">Gateway</text><rect class="lane" x="578" y="6" width="282" height="968" rx="8"/><text class="lane-label" x="719" y="27" text-anchor="middle">Agent service</text><rect class="lane" x="868" y="6" width="252" height="968" rx="8"/><text class="lane-label" x="994" y="27" text-anchor="middle">Chat service</text><path class="e e-live" d="M592 915 L288 915" marker-end="url(#d8-live)"/><path class="e e-live" d="M592 663 L288 663" marker-end="url(#d8-live)"/><path class="e e-fail" d="M288 579 L592 579" marker-end="url(#d8-fail)"/><path class="e e-data" d="M846 831 L882 831" marker-end="url(#d8-data)"/><path class="e e-data" d="M846 495 L882 495" marker-end="url(#d8-data)"/><path class="e e-data" d="M846 411 L882 411" marker-end="url(#d8-data)"/><path class="e e-flow" d="M719 862 L719 884" marker-end="url(#d8-flow)"/><path class="e e-flow" d="M719 778 L719 800" marker-end="url(#d8-flow)"/><path class="e e-flow" d="M719 694 L719 716" marker-end="url(#d8-flow)"/><path class="e e-flow" d="M719 610 L719 632" marker-end="url(#d8-flow)"/><path class="e e-flow" d="M719 526 L719 548" marker-end="url(#d8-flow)"/><path class="e e-flow" d="M719 442 L719 464" marker-end="url(#d8-flow)"/><path class="e e-flow" d="M719 358 L719 380" marker-end="url(#d8-flow)"/><path class="e e-fail" d="M322 411 L288 411" marker-end="url(#d8-fail)"/><path class="e e-flow" d="M439 358 L439 380" marker-end="url(#d8-flow)"/><path class="e e-flow" d="M556 327 L592 327" marker-end="url(#d8-flow)"/><path class="e e-flow" d="M288 327 L322 327" marker-end="url(#d8-flow)"/><path class="e e-data" d="M288 243 L882 243" marker-end="url(#d8-data)"/><path class="e e-flow" d="M44 159 L33 159 Q26 159 26 166 L26 320 Q26 327 33 327 L44 327" marker-end="url(#d8-flow)"/><path class="e e-flow" d="M166 274 L166 296" marker-end="url(#d8-flow)"/><path class="e e-flow" d="M166 190 L166 212" marker-end="url(#d8-flow)"/><path class="e e-flow" d="M166 106 L166 128" marker-end="url(#d8-flow)"/><rect class="n n-ui" x="44" y="44" width="244" height="62" rx="7"/><text class="t" x="166" y="71.75" text-anchor="middle">User presses Send</text><text class="s" x="166" y="86.75" text-anchor="middle">ChatArea shows the message at once</text><polygon class="n n-dec" points="60,128 272,128 288,159 272,190 60,190 44,159"/><text class="t" x="166" y="163" text-anchor="middle">Conversation open?</text><rect class="n n-ui" x="44" y="212" width="244" height="62" rx="7"/><text class="t" x="166" y="239.75" text-anchor="middle">ensureConversation</text><text class="s" x="166" y="254.75" text-anchor="middle">named after the first 40 characters</text><rect class="n n-ui" x="44" y="296" width="244" height="62" rx="7"/><text class="t" x="166" y="323.75" text-anchor="middle">POST /api/agent/chat/stream</text><text class="s" x="166" y="338.75" text-anchor="middle">prompt, conversationId, agent if picked</text><rect class="n n-fail" x="44" y="380" width="244" height="62" rx="7"/><text class="t" x="166" y="415" text-anchor="middle">Show “Something went wrong”</text><rect class="n n-ui" x="44" y="548" width="244" height="62" rx="7"/><text class="t" x="166" y="575.75" text-anchor="middle">Stop button or tab closed</text><text class="s" x="166" y="590.75" text-anchor="middle">aborts the fetch; text so far stays</text><rect class="n n-ui" x="44" y="632" width="244" height="62" rx="7"/><text class="t" x="166" y="659.75" text-anchor="middle">Show reply as it arrives</text><text class="s" x="166" y="674.75" text-anchor="middle">appends each token, renders Markdown</text><rect class="n n-ui" x="44" y="884" width="244" height="62" rx="7"/><text class="t" x="166" y="904.5" text-anchor="middle">Open artifact panel if needed</text><text class="s" x="166" y="919.5" text-anchor="middle">coding: code and preview; pdf, ppt:</text><text class="s" x="166" y="934" text-anchor="middle">viewer</text><polygon class="n n-dec" points="338,296 540,296 556,327 540,358 338,358 322,327"/><text class="t" x="439" y="323.75" text-anchor="middle">Session in Redis?</text><text class="s" x="439" y="338.75" text-anchor="middle">yes: adds user headers</text><rect class="n n-fail" x="322" y="380" width="234" height="62" rx="7"/><text class="t" x="439" y="407.75" text-anchor="middle">400 response</text><text class="s" x="439" y="422.75" text-anchor="middle">no cookie, or session expired</text><rect class="n n-step" x="592" y="296" width="254" height="62" rx="7"/><text class="t" x="719" y="323.75" text-anchor="middle">Validate prompt, open SSE stream</text><text class="s" x="719" y="338.75" text-anchor="middle">400 if the prompt is empty</text><rect class="n n-step" x="592" y="380" width="254" height="62" rx="7"/><text class="t" x="719" y="407.75" text-anchor="middle">getHistory</text><text class="s" x="719" y="422.75" text-anchor="middle">last 20 messages, oldest first</text><rect class="n n-step" x="592" y="464" width="254" height="62" rx="7"/><text class="t" x="719" y="499" text-anchor="middle">Save the user's message</text><rect class="n n-graph" x="592" y="548" width="254" height="62" rx="7"/><text class="t" x="719" y="575.75" text-anchor="middle">Run the agent graph</text><text class="s" x="719" y="590.75" text-anchor="middle">graph.stream, see section 3</text><rect class="n n-step" x="592" y="632" width="254" height="62" rx="7"/><text class="t" x="719" y="659.75" text-anchor="middle">Forward LLM tokens</text><text class="s" x="719" y="674.75" text-anchor="middle">skips router, search, imageGen, pdf, ppt</text><rect class="n n-step" x="592" y="716" width="254" height="62" rx="7"/><text class="t" x="719" y="736.5" text-anchor="middle">Read final state</text><text class="s" x="719" y="751.5" text-anchor="middle">no tokens yet: send the reply as one</text><text class="s" x="719" y="766" text-anchor="middle">token</text><rect class="n n-step" x="592" y="800" width="254" height="62" rx="7"/><text class="t" x="719" y="835" text-anchor="middle">Save the assistant's reply</text><rect class="n n-step" x="592" y="884" width="254" height="62" rx="7"/><text class="t" x="719" y="911.75" text-anchor="middle">Send done, end the stream</text><text class="s" x="719" y="926.75" text-anchor="middle">done carries agent and aiResponse</text><rect class="n n-store" x="882" y="212" width="224" height="62" rx="7"/><text class="t" x="994" y="231.75" text-anchor="middle">Create and title</text><text class="t" x="994" y="247.75" text-anchor="middle">conversation</text><text class="s" x="994" y="262.75" text-anchor="middle">MongoDB</text><rect class="n n-store" x="882" y="380" width="224" height="62" rx="7"/><text class="t" x="994" y="407.75" text-anchor="middle">GET /get-messages/:id</text><text class="s" x="994" y="422.75" text-anchor="middle">MongoDB, newest first</text><rect class="n n-store" x="882" y="464" width="224" height="62" rx="7"/><text class="t" x="994" y="491.75" text-anchor="middle">POST /save-messages</text><text class="s" x="994" y="506.75" text-anchor="middle">MongoDB</text><rect class="n n-store" x="882" y="800" width="224" height="62" rx="7"/><text class="t" x="994" y="827.75" text-anchor="middle">POST /save-messages</text><text class="s" x="994" y="842.75" text-anchor="middle">MongoDB</text><text class="l" x="174" y="208" text-anchor="start">no</text><text class="l" x="18" y="240" text-anchor="start">yes</text><text class="l" x="585" y="243" text-anchor="middle">through the gateway: create-conversation, update-conversation</text><text class="l" x="574" y="320" text-anchor="middle">yes</text><text class="l" x="447" y="376" text-anchor="start">no</text><text class="l" x="864" y="405" text-anchor="middle">reads</text><text class="l" x="864" y="489" text-anchor="middle">writes</text><text class="l" x="864" y="825" text-anchor="middle">writes</text><text class="l l-fail" x="440" y="572" text-anchor="middle">connection closes: res “close” aborts the graph</text><text class="l" x="440" y="656" text-anchor="middle">SSE: agent and token events</text><text class="l" x="440" y="908" text-anchor="middle">SSE: done event</text></svg>
