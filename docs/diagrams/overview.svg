<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1000" width="1150" height="1000" role="img" aria-label="End-to-end flowchart of Aryan&#x27;s Assistant. 1 Sign in: the app checks the session cookie; without one the user signs in with Google, the auth service verifies the Firebase token, saves the user in MongoDB and a session in Redis. 2 Send a message: the user types a message, the gateway checks the session in Redis (401 if missing) and forwards to the agent service, which loads history and saves the user message through the chat service. 3 Agent graph: the agent picked in the UI is used, otherwise the router LLM picks one, falling back to chat. A switch sends the request to search, chat, coding, pdf, ppt or imageGen; search hands its results to chat. Chat and coding stream tokens live; pdf, ppt and imageGen upload a file to private S3. 4 Save and show: the reply is saved in MongoDB and shown in the chat, with files and code in the artifact panel."><style>svg{--bg:#f3f5f7;--panel:#ffffff;--ink:#17212b;--muted:#55636f;--line:#cdd5dc;--edge:#3f4d59;--ui-f:#e4eefb;--ui-s:#2a64b8;--svc-f:#e9ecf1;--svc-s:#3f4d59;--llm-f:#efe9fb;--llm-s:#6a3fc0;--ext-f:#fcf1da;--ext-s:#9a6400;--store-f:#dff2ef;--store-s:#0d7168;--out-f:#e6f3e0;--out-s:#3c7a27;--fail-f:#fcebe9;--fail-s:#b3261e;--live:#2a64b8;}@media (prefers-color-scheme:dark){svg{--bg:#11161b;--panel:#1a2128;--ink:#e7ecf0;--muted:#a0adb8;--line:#36424d;--edge:#a7b4bf;--ui-f:#15283f;--ui-s:#7baef0;--svc-f:#242c34;--svc-s:#a7b4bf;--llm-f:#2a2145;--llm-s:#ad90f2;--ext-f:#33280f;--ext-s:#deb159;--store-f:#10302e;--store-s:#55c6ba;--out-f:#1b2f15;--out-s:#8dcb75;--fail-f:#3a1816;--fail-s:#f28d85;--live:#7baef0;}}
.bg{fill:var(--panel)}text{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.n{stroke-width:1.4}.n-ui{fill:var(--ui-f);stroke:var(--ui-s)}.n-svc,.n-agent,.n-graph{fill:var(--svc-f);stroke:var(--svc-s)}.n-agent,.n-graph{stroke-width:2}
.n-step{fill:var(--panel);stroke:var(--edge)}.n-dec{fill:var(--panel);stroke:var(--ink);stroke-width:1.6}.n-llm{fill:var(--llm-f);stroke:var(--llm-s)}.n-ext{fill:var(--ext-f);stroke:var(--ext-s)}.n-store{fill:var(--store-f);stroke:var(--store-s)}.n-out{fill:var(--out-f);stroke:var(--out-s)}.n-fail{fill:var(--fail-f);stroke:var(--fail-s);stroke-dasharray:4 3}.n-pill{fill:var(--ink);stroke:var(--ink)}
.t{font-size:13px;font-weight:600;fill:var(--ink)}.s{font-size:11.5px;fill:var(--muted)}.n-pill + .t{fill:var(--bg)}
.l{font-size:11px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.l-fail{fill:var(--fail-s)}
.e{fill:none;stroke:var(--edge);stroke-width:1.4}.e-fail{stroke:var(--fail-s);stroke-dasharray:5 4}.e-data{stroke:var(--store-s);stroke-dasharray:2 3;stroke-width:1.7}.e-live{stroke:var(--live);stroke-width:2}
.m-flow{fill:var(--edge)}.m-fail{fill:var(--fail-s)}.m-data{fill:var(--store-s)}.m-live{fill:var(--live)}
.frame{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 3}.frame-label{font-size:11px;fill:var(--muted)}
.lane{fill:var(--bg);stroke:var(--line)}.lane-label{font-size:12.5px;font-weight:700;fill:var(--muted);letter-spacing:.04em}</style><rect class="bg" width="1150" height="1000" rx="10"/><defs><marker id="d20-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-flow" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d20-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-data" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d20-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-fail" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d20-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-live" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="frame" x="14" y="24" width="1122" height="186" rx="10"/><text class="frame-label" x="26" y="42">1  Sign in</text><rect class="frame" x="14" y="226" width="1122" height="186" rx="10"/><text class="frame-label" x="26" y="244">2  Send a message</text><rect class="frame" x="14" y="428" width="1122" height="380" rx="10"/><text class="frame-label" x="26" y="446">3  Agent graph (LangGraph, agent service)</text><rect class="frame" x="14" y="824" width="1122" height="160" rx="10"/><text class="frame-label" x="26" y="842">4  Save and show the reply</text><path class="e e-flow" d="M116 119 L146 119" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M326 119 L370 119" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M560 119 L604 119" marker-end="url(#d20-flow)"/><path class="e e-data" d="M794 112 L838 112" marker-end="url(#d20-data)"/><path class="e e-data" d="M794 130 L805 130 Q812 130 812 137 L812 163 Q812 170 819 170 L1049 170 Q1056 170 1056 163 L1056 156" marker-end="url(#d20-data)"/><path class="e e-flow" d="M236 154 L236 262" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M1056 82 L1056 73 Q1056 66 1063 66 L1123 66 Q1130 66 1130 73 L1130 211 Q1130 218 1123 218 L307 218 Q300 218 300 225 L300 262" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M326 293 L370 293" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M560 293 L604 293" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M794 293 L838 293" marker-end="url(#d20-flow)"/><path class="e e-fail" d="M699 328 L699 350" marker-end="url(#d20-fail)"/><path class="e e-data" d="M980 330 L980 350" marker-end="url(#d20-data)"/><path class="e e-flow" d="M880 330 L880 335 Q880 340 873 340 L833 340 Q826 340 826 347 L826 413 Q826 420 819 420 L122 420 Q115 420 115 427 L115 505" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M115 575 L115 630" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M200 540 L339 540 Q346 540 346 547 L346 567" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M205 663 L339 663 Q346 663 346 656 L346 637" marker-end="url(#d20-flow)"/><path class="e e-fail" d="M115 696 L115 728" marker-end="url(#d20-fail)"/><path class="e e-fail" d="M205 751 L359 751 Q366 751 366 744 L366 637" marker-end="url(#d20-fail)"/><path class="e e-flow" d="M406 602 L493 602 Q500 602 500 595 L500 478 Q500 471 507 471 L560 471" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M406 602 L493 602 Q500 602 500 595 L500 536 Q500 529 507 529 L560 529" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M406 602 L493 602 Q500 602 500 595 L500 594 Q500 587 507 587 L560 587" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M406 602 L493 602 Q500 602 500 609 L500 638 Q500 645 507 645 L560 645" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M406 602 L493 602 Q500 602 500 609 L500 696 Q500 703 507 703 L560 703" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M406 602 L493 602 Q500 602 500 609 L500 754 Q500 761 507 761 L560 761" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M780 471 L793 471 Q800 471 800 478 L800 522 Q800 529 793 529 L780 529" marker-end="url(#d20-flow)"/><path class="e e-live" d="M780 529 L843 529 Q850 529 850 526 L850 526 Q850 523 857 523 L880 523" marker-end="url(#d20-live)"/><path class="e e-live" d="M780 587 L843 587 Q850 587 850 580 L850 530 Q850 523 857 523 L880 523" marker-end="url(#d20-live)"/><path class="e e-flow" d="M780 645 L843 645 Q850 645 850 652 L850 670 Q850 677 857 677 L880 677" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M780 703 L843 703 Q850 703 850 696 L850 684 Q850 677 857 677 L880 677" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M780 761 L843 761 Q850 761 850 754 L850 684 Q850 677 857 677 L880 677" marker-end="url(#d20-flow)"/><path class="e e-data" d="M1001 708 L1001 726" marker-end="url(#d20-data)"/><path class="e e-live" d="M1122 523 L1128 523 Q1134 523 1134 530 L1134 886 Q1134 893 1128 893 L1122 893" marker-end="url(#d20-live)"/><path class="e e-flow" d="M1001 792 L1001 862" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M838 893 L780 893" marker-end="url(#d20-flow)"/><path class="e e-flow" d="M450 893 L390 893" marker-end="url(#d20-flow)"/><rect class="n n-pill" x="30" y="96" width="86" height="46" rx="23.0"/><text class="t" x="73.0" y="123.0" text-anchor="middle">Open app</text><polygon class="n n-dec" points="162,84 310,84 326,119.0 310,154 162,154 146,119.0"/><text class="t" x="236.0" y="114.5" text-anchor="middle">Session cookie</text><text class="t" x="236.0" y="130.5" text-anchor="middle">valid?</text><rect class="n n-ext" x="370" y="88" width="190" height="62" rx="7"/><text class="t" x="465.0" y="115.2" text-anchor="middle">Continue with Google</text><text class="s" x="465.0" y="131.2" text-anchor="middle">Firebase popup → ID token</text><rect class="n n-svc" x="604" y="88" width="190" height="62" rx="7"/><text class="t" x="699.0" y="115.2" text-anchor="middle">Auth service</text><text class="s" x="699.0" y="131.2" text-anchor="middle">verify token, find or create user</text><path class="n n-store" d="M838 90 A66.0 8 0 0 1 970 90 L970 148 A66.0 8 0 0 1 838 148 Z"/><path class="n n-store" d="M838 90 A66.0 8 0 0 0 970 90" fill="none"/><text class="t" x="904.0" y="119.2" text-anchor="middle">MongoDB</text><text class="s" x="904.0" y="135.2" text-anchor="middle">users</text><path class="n n-store" d="M990 90 A66.0 8 0 0 1 1122 90 L1122 148 A66.0 8 0 0 1 990 148 Z"/><path class="n n-store" d="M990 90 A66.0 8 0 0 0 1122 90" fill="none"/><text class="t" x="1056.0" y="119.2" text-anchor="middle">Redis</text><text class="s" x="1056.0" y="135.2" text-anchor="middle">session:&lt;id&gt;, 7 days</text><rect class="n n-ui" x="146" y="262" width="180" height="62" rx="7"/><text class="t" x="236.0" y="289.2" text-anchor="middle">Chat screen</text><text class="s" x="236.0" y="305.2" text-anchor="middle">sidebar of saved chats</text><rect class="n n-ui" x="370" y="262" width="190" height="62" rx="7"/><text class="t" x="465.0" y="289.2" text-anchor="middle">Type a message</text><text class="s" x="465.0" y="305.2" text-anchor="middle">Auto, or pick an agent</text><polygon class="n n-dec" points="620,258 778,258 794,293.0 778,328 620,328 604,293.0"/><text class="t" x="699.0" y="288.5" text-anchor="middle">Gateway: session</text><text class="t" x="699.0" y="304.5" text-anchor="middle">in Redis?</text><rect class="n n-fail" x="604" y="350" width="190" height="46" rx="7"/><text class="t" x="699.0" y="376.5" text-anchor="middle">401: sign in again</text><rect class="n n-svc" x="838" y="256" width="284" height="74" rx="7"/><text class="t" x="980.0" y="282.0" text-anchor="middle">Agent service</text><text class="s" x="980.0" y="298.0" text-anchor="middle">POST /api/agent/chat/stream (SSE), x-user-id</text><text class="s" x="980.0" y="312.5" text-anchor="middle">loads last 20 messages, saves the user&#x27;s</text><rect class="n n-svc" x="838" y="350" width="284" height="46" rx="7"/><text class="t" x="980.0" y="369.2" text-anchor="middle">Chat service → MongoDB</text><text class="s" x="980.0" y="385.2" text-anchor="middle">conversations, messages</text><polygon class="n n-dec" points="46,505 184,505 200,540.0 184,575 46,575 30,540.0"/><text class="t" x="115.0" y="535.5" text-anchor="middle">Agent picked</text><text class="t" x="115.0" y="551.5" text-anchor="middle">in the UI?</text><rect class="n n-llm" x="25" y="630" width="180" height="66" rx="7"/><text class="t" x="115.0" y="652.0" text-anchor="middle">Router LLM</text><text class="s" x="115.0" y="668.0" text-anchor="middle">Groq gpt-oss-20b</text><text class="s" x="115.0" y="682.5" text-anchor="middle">picks one agent name</text><rect class="n n-fail" x="25" y="728" width="180" height="46" rx="7"/><text class="t" x="115.0" y="747.2" text-anchor="middle">Fall back to chat</text><text class="s" x="115.0" y="763.2" text-anchor="middle">error or bad name</text><polygon class="n n-dec" points="302,567 390,567 406,602.0 390,637 302,637 286,602.0"/><text class="t" x="346.0" y="597.5" text-anchor="middle">switch on</text><text class="t" x="346.0" y="613.5" text-anchor="middle">agent</text><rect class="n n-agent" x="560" y="448" width="220" height="46" rx="7"/><text class="t" x="670.0" y="467.2" text-anchor="middle">search</text><text class="s" x="670.0" y="483.2" text-anchor="middle">Tavily web results</text><rect class="n n-agent" x="560" y="506" width="220" height="46" rx="7"/><text class="t" x="670.0" y="525.2" text-anchor="middle">chat</text><text class="s" x="670.0" y="541.2" text-anchor="middle">Groq, streams tokens</text><rect class="n n-agent" x="560" y="564" width="220" height="46" rx="7"/><text class="t" x="670.0" y="583.2" text-anchor="middle">coding</text><text class="s" x="670.0" y="599.2" text-anchor="middle">OpenRouter, streams tokens</text><rect class="n n-agent" x="560" y="622" width="220" height="46" rx="7"/><text class="t" x="670.0" y="641.2" text-anchor="middle">pdf</text><text class="s" x="670.0" y="657.2" text-anchor="middle">Groq → HTML → Puppeteer</text><rect class="n n-agent" x="560" y="680" width="220" height="46" rx="7"/><text class="t" x="670.0" y="699.2" text-anchor="middle">ppt</text><text class="s" x="670.0" y="715.2" text-anchor="middle">Groq → PptxGenJS + PDF copy</text><rect class="n n-agent" x="560" y="738" width="220" height="46" rx="7"/><text class="t" x="670.0" y="757.2" text-anchor="middle">imageGen</text><text class="s" x="670.0" y="773.2" text-anchor="middle">Groq prompt → Pollinations</text><rect class="n n-out" x="880" y="486" width="242" height="74" rx="7"/><text class="t" x="1001.0" y="512.0" text-anchor="middle">Stream tokens live</text><text class="s" x="1001.0" y="528.0" text-anchor="middle">SSE events: agent, token, done</text><text class="s" x="1001.0" y="542.5" text-anchor="middle">Stop button aborts the LLM call</text><rect class="n n-ext" x="880" y="646" width="242" height="62" rx="7"/><text class="t" x="1001.0" y="673.2" text-anchor="middle">Render the file</text><text class="s" x="1001.0" y="689.2" text-anchor="middle">PDF, PPTX + PDF, or image</text><path class="n n-store" d="M880 734 A121.0 8 0 0 1 1122 734 L1122 784 A121.0 8 0 0 1 880 784 Z"/><path class="n n-store" d="M880 734 A121.0 8 0 0 0 1122 734" fill="none"/><text class="t" x="1001.0" y="759.2" text-anchor="middle">Private S3 bucket</text><text class="s" x="1001.0" y="775.2" text-anchor="middle">reply keeps /api/agent/files/… link</text><rect class="n n-svc" x="838" y="862" width="284" height="62" rx="7"/><text class="t" x="980.0" y="889.2" text-anchor="middle">Save the reply</text><text class="s" x="980.0" y="905.2" text-anchor="middle">chat service → MongoDB</text><rect class="n n-out" x="450" y="862" width="330" height="62" rx="7"/><text class="t" x="615.0" y="889.2" text-anchor="middle">Reply appears in the chat</text><text class="s" x="615.0" y="905.2" text-anchor="middle">code, PDFs, decks and images open in the artifact panel</text><rect class="n n-pill" x="300" y="870" width="90" height="46" rx="23.0"/><text class="t" x="345.0" y="897.0" text-anchor="middle">Done</text><text class="s" x="228" y="172" text-anchor="end">GET /api/me → Redis</text><text class="l" x="348" y="113" text-anchor="middle">no</text><text class="l" x="582" y="80" text-anchor="middle">POST /api/auth/login</text><text class="l" x="930" y="166" text-anchor="middle">httpOnly cookie</text><text class="l" x="244" y="210" text-anchor="start">yes</text><text class="l" x="1000" y="214" text-anchor="middle">signed in</text><text class="l" x="816" y="312" text-anchor="middle">yes</text><text class="l l-fail" x="707" y="343" text-anchor="start">no</text><text class="l" x="123" y="607" text-anchor="start">no</text><text class="l" x="270" y="534" text-anchor="middle">yes</text><text class="l" x="806" y="500" text-anchor="start">results</text><text class="s" x="450" y="946" text-anchor="start">Next message: back to step 2. Opening a file link: session check, owner check, then a redirect to a short-lived S3 link.</text></svg>
