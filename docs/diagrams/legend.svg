<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 98" width="920" height="98" role="img" aria-label="Colour key for the diagrams"><style>svg{--bg:#f3f5f7;--panel:#ffffff;--ink:#17212b;--muted:#55636f;--line:#cdd5dc;--edge:#3f4d59;--ui-f:#e4eefb;--ui-s:#2a64b8;--svc-f:#e9ecf1;--svc-s:#3f4d59;--llm-f:#efe9fb;--llm-s:#6a3fc0;--ext-f:#fcf1da;--ext-s:#9a6400;--store-f:#dff2ef;--store-s:#0d7168;--out-f:#e6f3e0;--out-s:#3c7a27;--fail-f:#fcebe9;--fail-s:#b3261e;--live:#2a64b8;}@media (prefers-color-scheme:dark){svg{--bg:#11161b;--panel:#1a2128;--ink:#e7ecf0;--muted:#a0adb8;--line:#36424d;--edge:#a7b4bf;--ui-f:#15283f;--ui-s:#7baef0;--svc-f:#242c34;--svc-s:#a7b4bf;--llm-f:#2a2145;--llm-s:#ad90f2;--ext-f:#33280f;--ext-s:#deb159;--store-f:#10302e;--store-s:#55c6ba;--out-f:#1b2f15;--out-s:#8dcb75;--fail-f:#3a1816;--fail-s:#f28d85;--live:#7baef0;}}
.bg{fill:var(--panel)}text{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.n{stroke-width:1.4}.n-ui{fill:var(--ui-f);stroke:var(--ui-s)}.n-svc,.n-agent,.n-graph{fill:var(--svc-f);stroke:var(--svc-s)}.n-agent,.n-graph{stroke-width:2}
.n-step{fill:var(--panel);stroke:var(--edge)}.n-dec{fill:var(--panel);stroke:var(--ink);stroke-width:1.6}.n-llm{fill:var(--llm-f);stroke:var(--llm-s)}.n-ext{fill:var(--ext-f);stroke:var(--ext-s)}.n-store{fill:var(--store-f);stroke:var(--store-s)}.n-out{fill:var(--out-f);stroke:var(--out-s)}.n-fail{fill:var(--fail-f);stroke:var(--fail-s);stroke-dasharray:4 3}.n-pill{fill:var(--ink);stroke:var(--ink)}
.t{font-size:13px;font-weight:600;fill:var(--ink)}.s{font-size:11.5px;fill:var(--muted)}.n-pill + .t{fill:var(--bg)}
.l{font-size:11px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.l-fail{fill:var(--fail-s)}
.e{fill:none;stroke:var(--edge);stroke-width:1.4}.e-fail{stroke:var(--fail-s);stroke-dasharray:5 4}.e-data{stroke:var(--store-s);stroke-dasharray:2 3;stroke-width:1.7}.e-live{stroke:var(--live);stroke-width:2}
.m-flow{fill:var(--edge)}.m-fail{fill:var(--fail-s)}.m-data{fill:var(--store-s)}.m-live{fill:var(--live)}
.frame{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 3}.frame-label{font-size:11px;fill:var(--muted)}
.lane{fill:var(--bg);stroke:var(--line)}.lane-label{font-size:12.5px;font-weight:700;fill:var(--muted);letter-spacing:.04em}</style><rect class="bg" width="920" height="98" rx="10"/><rect class="n n-ui" x="18" y="14" width="26" height="16" rx="4"/><text class="s" x="52" y="26">Browser</text><rect class="n n-svc" x="243" y="14" width="26" height="16" rx="4"/><text class="s" x="277" y="26">Backend service</text><rect class="n n-step" x="468" y="14" width="26" height="16" rx="4"/><text class="s" x="502" y="26">Processing step</text><rect class="n n-llm" x="693" y="14" width="26" height="16" rx="4"/><text class="s" x="727" y="26">LLM call</text><rect class="n n-ext" x="18" y="42" width="26" height="16" rx="4"/><text class="s" x="52" y="54">External service</text><rect class="n n-store" x="243" y="42" width="26" height="16" rx="4"/><text class="s" x="277" y="54">Storage</text><rect class="n n-out" x="468" y="42" width="26" height="16" rx="4"/><text class="s" x="502" y="54">Writes to graph state</text><rect class="n n-fail" x="693" y="42" width="26" height="16" rx="4"/><text class="s" x="727" y="54">Failure or fallback</text><line class="e e-fail" x1="18" y1="78" x2="44" y2="78"/><text class="s" x="52" y="82">Failure path</text><line class="e e-data" x1="243" y1="78" x2="269" y2="78"/><text class="s" x="277" y="82">Data read or write</text><line class="e e-live" x1="468" y1="78" x2="494" y2="78"/><text class="s" x="502" y="82">Stream to browser</text></svg>
