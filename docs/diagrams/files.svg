<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 210" width="1150" height="210" role="img" aria-label="File access flow: the browser requests a permanent path through the gateway, the session is checked, the agent service compares the user id in the file key with the logged-in user, then redirects to a one-hour pre-signed S3 link."><style>svg{--bg:#f3f5f7;--panel:#ffffff;--ink:#17212b;--muted:#55636f;--line:#cdd5dc;--edge:#3f4d59;--ui-f:#e4eefb;--ui-s:#2a64b8;--svc-f:#e9ecf1;--svc-s:#3f4d59;--llm-f:#efe9fb;--llm-s:#6a3fc0;--ext-f:#fcf1da;--ext-s:#9a6400;--store-f:#dff2ef;--store-s:#0d7168;--out-f:#e6f3e0;--out-s:#3c7a27;--fail-f:#fcebe9;--fail-s:#b3261e;--live:#2a64b8;}@media (prefers-color-scheme:dark){svg{--bg:#11161b;--panel:#1a2128;--ink:#e7ecf0;--muted:#a0adb8;--line:#36424d;--edge:#a7b4bf;--ui-f:#15283f;--ui-s:#7baef0;--svc-f:#242c34;--svc-s:#a7b4bf;--llm-f:#2a2145;--llm-s:#ad90f2;--ext-f:#33280f;--ext-s:#deb159;--store-f:#10302e;--store-s:#55c6ba;--out-f:#1b2f15;--out-s:#8dcb75;--fail-f:#3a1816;--fail-s:#f28d85;--live:#7baef0;}}
.bg{fill:var(--panel)}text{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.n{stroke-width:1.4}.n-ui{fill:var(--ui-f);stroke:var(--ui-s)}.n-svc,.n-agent,.n-graph{fill:var(--svc-f);stroke:var(--svc-s)}.n-agent,.n-graph{stroke-width:2}
.n-step{fill:var(--panel);stroke:var(--edge)}.n-dec{fill:var(--panel);stroke:var(--ink);stroke-width:1.6}.n-llm{fill:var(--llm-f);stroke:var(--llm-s)}.n-ext{fill:var(--ext-f);stroke:var(--ext-s)}.n-store{fill:var(--store-f);stroke:var(--store-s)}.n-out{fill:var(--out-f);stroke:var(--out-s)}.n-fail{fill:var(--fail-f);stroke:var(--fail-s);stroke-dasharray:4 3}.n-pill{fill:var(--ink);stroke:var(--ink)}
.t{font-size:13px;font-weight:600;fill:var(--ink)}.s{font-size:11.5px;fill:var(--muted)}.n-pill + .t{fill:var(--bg)}
.l{font-size:11px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.l-fail{fill:var(--fail-s)}
.e{fill:none;stroke:var(--edge);stroke-width:1.4}.e-fail{stroke:var(--fail-s);stroke-dasharray:5 4}.e-data{stroke:var(--store-s);stroke-dasharray:2 3;stroke-width:1.7}.e-live{stroke:var(--live);stroke-width:2}
.m-flow{fill:var(--edge)}.m-fail{fill:var(--fail-s)}.m-data{fill:var(--store-s)}.m-live{fill:var(--live)}
.frame{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 3}.frame-label{font-size:11px;fill:var(--muted)}
.lane{fill:var(--bg);stroke:var(--line)}.lane-label{font-size:12.5px;font-weight:700;fill:var(--muted);letter-spacing:.04em}</style><rect class="bg" width="1150" height="210" rx="10"/><defs><marker id="d11-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-flow" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d11-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-data" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d11-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-fail" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d11-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-live" d="M0 0 L10 5 L0 10 z"/></marker></defs><path class="e e-flow" d="M906 53 L938 53" marker-end="url(#d11-flow)"/><path class="e e-fail" d="M574 90 L574 130" marker-end="url(#d11-fail)"/><path class="e e-flow" d="M674 53 L706 53" marker-end="url(#d11-flow)"/><path class="e e-flow" d="M442 53 L474 53" marker-end="url(#d11-flow)"/><path class="e e-flow" d="M210 53 L242 53" marker-end="url(#d11-flow)"/><rect class="n n-ui" x="10" y="16" width="200" height="74" rx="7"/><text class="t" x="110" y="49.75" text-anchor="middle">Open a generated file</text><text class="s" x="110" y="64.75" text-anchor="middle">GET /api/agent/files/&lt;key&gt;</text><rect class="n n-svc" x="242" y="16" width="200" height="74" rx="7"/><text class="t" x="342" y="49.75" text-anchor="middle">protect</text><text class="s" x="342" y="64.75" text-anchor="middle">gateway adds x-user-id</text><polygon class="n n-dec" points="490,16 658,16 674,53 658,90 490,90 474,53"/><text class="t" x="574" y="49" text-anchor="middle">Key's user id</text><text class="t" x="574" y="65" text-anchor="middle">matches?</text><rect class="n n-svc" x="706" y="16" width="200" height="74" rx="7"/><text class="t" x="806" y="49.75" text-anchor="middle">Create pre-signed link</text><text class="s" x="806" y="64.75" text-anchor="middle">valid for 1 hour</text><rect class="n n-store" x="938" y="16" width="200" height="74" rx="7"/><text class="t" x="1038" y="49.75" text-anchor="middle">302 to S3</text><text class="s" x="1038" y="64.75" text-anchor="middle">browser reads the file</text><rect class="n n-fail" x="474" y="130" width="200" height="62" rx="7"/><text class="t" x="574" y="165" text-anchor="middle">404 File not found</text><text class="l" x="690" y="47" text-anchor="middle">yes</text><text class="l l-fail" x="582" y="115" text-anchor="start">no</text></svg>
