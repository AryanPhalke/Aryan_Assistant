<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 262" width="1130" height="262" role="img" aria-label="Login flow: Google popup through Firebase returns an ID token, the auth service verifies it, finds or creates the user, writes a session to Redis and sets an httpOnly cookie. On page load the app calls /api/me to restore the user."><style>svg{--bg:#f3f5f7;--panel:#ffffff;--ink:#17212b;--muted:#55636f;--line:#cdd5dc;--edge:#3f4d59;--ui-f:#e4eefb;--ui-s:#2a64b8;--svc-f:#e9ecf1;--svc-s:#3f4d59;--llm-f:#efe9fb;--llm-s:#6a3fc0;--ext-f:#fcf1da;--ext-s:#9a6400;--store-f:#dff2ef;--store-s:#0d7168;--out-f:#e6f3e0;--out-s:#3c7a27;--fail-f:#fcebe9;--fail-s:#b3261e;--live:#2a64b8;}@media (prefers-color-scheme:dark){svg{--bg:#11161b;--panel:#1a2128;--ink:#e7ecf0;--muted:#a0adb8;--line:#36424d;--edge:#a7b4bf;--ui-f:#15283f;--ui-s:#7baef0;--svc-f:#242c34;--svc-s:#a7b4bf;--llm-f:#2a2145;--llm-s:#ad90f2;--ext-f:#33280f;--ext-s:#deb159;--store-f:#10302e;--store-s:#55c6ba;--out-f:#1b2f15;--out-s:#8dcb75;--fail-f:#3a1816;--fail-s:#f28d85;--live:#7baef0;}}
.bg{fill:var(--panel)}text{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.n{stroke-width:1.4}.n-ui{fill:var(--ui-f);stroke:var(--ui-s)}.n-svc,.n-agent,.n-graph{fill:var(--svc-f);stroke:var(--svc-s)}.n-agent,.n-graph{stroke-width:2}
.n-step{fill:var(--panel);stroke:var(--edge)}.n-dec{fill:var(--panel);stroke:var(--ink);stroke-width:1.6}.n-llm{fill:var(--llm-f);stroke:var(--llm-s)}.n-ext{fill:var(--ext-f);stroke:var(--ext-s)}.n-store{fill:var(--store-f);stroke:var(--store-s)}.n-out{fill:var(--out-f);stroke:var(--out-s)}.n-fail{fill:var(--fail-f);stroke:var(--fail-s);stroke-dasharray:4 3}.n-pill{fill:var(--ink);stroke:var(--ink)}
.t{font-size:13px;font-weight:600;fill:var(--ink)}.s{font-size:11.5px;fill:var(--muted)}.n-pill + .t{fill:var(--bg)}
.l{font-size:11px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.l-fail{fill:var(--fail-s)}
.e{fill:none;stroke:var(--edge);stroke-width:1.4}.e-fail{stroke:var(--fail-s);stroke-dasharray:5 4}.e-data{stroke:var(--store-s);stroke-dasharray:2 3;stroke-width:1.7}.e-live{stroke:var(--live);stroke-width:2}
.m-flow{fill:var(--edge)}.m-fail{fill:var(--fail-s)}.m-data{fill:var(--store-s)}.m-live{fill:var(--live)}
.frame{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 3}.frame-label{font-size:11px;fill:var(--muted)}
.lane{fill:var(--bg);stroke:var(--line)}.lane-label{font-size:12.5px;font-weight:700;fill:var(--muted);letter-spacing:.04em}</style><rect class="bg" width="1130" height="262" rx="10"/><defs><marker id="d10-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-flow" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d10-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-data" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d10-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-fail" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d10-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-live" d="M0 0 L10 5 L0 10 z"/></marker></defs><path class="e e-flow" d="M370 197 L390 197" marker-end="url(#d10-flow)"/><path class="e e-flow" d="M180 197 L200 197" marker-end="url(#d10-flow)"/><path class="e e-fail" d="M665 90 L665 160" marker-end="url(#d10-fail)"/><path class="e e-flow" d="M960 197 L940 197" marker-end="url(#d10-flow)"/><path class="e e-flow" d="M1045 90 L1045 160" marker-end="url(#d10-flow)"/><path class="e e-flow" d="M940 53 L960 53" marker-end="url(#d10-flow)"/><path class="e e-flow" d="M750 53 L770 53" marker-end="url(#d10-flow)"/><path class="e e-flow" d="M560 53 L580 53" marker-end="url(#d10-flow)"/><path class="e e-flow" d="M370 53 L390 53" marker-end="url(#d10-flow)"/><path class="e e-flow" d="M180 53 L200 53" marker-end="url(#d10-flow)"/><rect class="n n-ui" x="10" y="16" width="170" height="74" rx="7"/><text class="t" x="95" y="49.75" text-anchor="middle">Continue with Google</text><text class="s" x="95" y="64.75" text-anchor="middle">signInWithPopup</text><rect class="n n-ext" x="200" y="16" width="170" height="74" rx="7"/><text class="t" x="285" y="49.75" text-anchor="middle">Firebase</text><text class="s" x="285" y="64.75" text-anchor="middle">returns an ID token</text><rect class="n n-svc" x="390" y="16" width="170" height="74" rx="7"/><text class="t" x="475" y="49.75" text-anchor="middle">POST /api/auth/login</text><text class="s" x="475" y="64.75" text-anchor="middle">gateway forwards, no check</text><rect class="n n-ext" x="580" y="16" width="170" height="74" rx="7"/><text class="t" x="665" y="49.75" text-anchor="middle">verifyIdToken</text><text class="s" x="665" y="64.75" text-anchor="middle">Firebase Admin SDK</text><rect class="n n-store" x="770" y="16" width="170" height="74" rx="7"/><text class="t" x="855" y="49.75" text-anchor="middle">Find or create user</text><text class="s" x="855" y="64.75" text-anchor="middle">MongoDB</text><rect class="n n-store" x="960" y="16" width="170" height="74" rx="7"/><text class="t" x="1045" y="49.75" text-anchor="middle">SET session:&lt;uuid&gt;</text><text class="s" x="1045" y="64.75" text-anchor="middle">Redis, 7 days</text><rect class="n n-ui" x="10" y="160" width="170" height="74" rx="7"/><text class="t" x="95" y="193.75" text-anchor="middle">On page load</text><text class="s" x="95" y="208.75" text-anchor="middle">App calls GET /api/me</text><rect class="n n-svc" x="200" y="160" width="170" height="74" rx="7"/><text class="t" x="285" y="193.75" text-anchor="middle">protect</text><text class="s" x="285" y="208.75" text-anchor="middle">cookie lookup in Redis</text><rect class="n n-ui" x="390" y="160" width="170" height="74" rx="7"/><text class="t" x="475" y="186.5" text-anchor="middle">Redux keeps the user</text><text class="s" x="475" y="201.5" text-anchor="middle">or shows the sign-in</text><text class="s" x="475" y="216" text-anchor="middle">screen</text><rect class="n n-fail" x="580" y="160" width="170" height="74" rx="7"/><text class="t" x="665" y="193.75" text-anchor="middle">500 login error</text><text class="s" x="665" y="208.75" text-anchor="middle">fake or expired token</text><rect class="n n-ui" x="770" y="160" width="170" height="74" rx="7"/><text class="t" x="855" y="193.75" text-anchor="middle">Redux setUserdata</text><text class="s" x="855" y="208.75" text-anchor="middle">chat layout appears</text><rect class="n n-svc" x="960" y="160" width="170" height="74" rx="7"/><text class="t" x="1045" y="193.75" text-anchor="middle">Set session cookie</text><text class="s" x="1045" y="208.75" text-anchor="middle">httpOnly, sameSite strict</text><text class="l l-fail" x="673" y="130" text-anchor="start">throws</text></svg>
