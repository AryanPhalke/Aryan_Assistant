<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1110" width="1150" height="1110" role="img" aria-label="Design for one million users. Edge: users load the React app from a CDN and reach a global load balancer with WAF and rate limits. Stateless services run as autoscaled pods: gateway, auth, chat and an agent API that holds SSE streams. The agent API enqueues each run on a job queue; LLM workers and file workers pull jobs, call the LLM gateway, stream tokens back through Redis pub/sub, and upload files to S3 behind a CDN. Data: Redis cluster for sessions, rate limits, cache and pub/sub; a sharded MongoDB cluster keyed by user id with read replicas; S3. External: an LLM gateway that pools keys and fails over between providers, plus Tavily, Pollinations and Firebase. Observability and per-user quotas cover every layer."><style>svg{--bg:#f3f5f7;--panel:#ffffff;--ink:#17212b;--muted:#55636f;--line:#cdd5dc;--edge:#3f4d59;--ui-f:#e4eefb;--ui-s:#2a64b8;--svc-f:#e9ecf1;--svc-s:#3f4d59;--llm-f:#efe9fb;--llm-s:#6a3fc0;--ext-f:#fcf1da;--ext-s:#9a6400;--store-f:#dff2ef;--store-s:#0d7168;--out-f:#e6f3e0;--out-s:#3c7a27;--fail-f:#fcebe9;--fail-s:#b3261e;--live:#2a64b8;}@media (prefers-color-scheme:dark){svg{--bg:#11161b;--panel:#1a2128;--ink:#e7ecf0;--muted:#a0adb8;--line:#36424d;--edge:#a7b4bf;--ui-f:#15283f;--ui-s:#7baef0;--svc-f:#242c34;--svc-s:#a7b4bf;--llm-f:#2a2145;--llm-s:#ad90f2;--ext-f:#33280f;--ext-s:#deb159;--store-f:#10302e;--store-s:#55c6ba;--out-f:#1b2f15;--out-s:#8dcb75;--fail-f:#3a1816;--fail-s:#f28d85;--live:#7baef0;}}
.bg{fill:var(--panel)}text{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.n{stroke-width:1.4}.n-ui{fill:var(--ui-f);stroke:var(--ui-s)}.n-svc,.n-agent,.n-graph{fill:var(--svc-f);stroke:var(--svc-s)}.n-agent,.n-graph{stroke-width:2}
.n-step{fill:var(--panel);stroke:var(--edge)}.n-dec{fill:var(--panel);stroke:var(--ink);stroke-width:1.6}.n-llm{fill:var(--llm-f);stroke:var(--llm-s)}.n-ext{fill:var(--ext-f);stroke:var(--ext-s)}.n-store{fill:var(--store-f);stroke:var(--store-s)}.n-out{fill:var(--out-f);stroke:var(--out-s)}.n-fail{fill:var(--fail-f);stroke:var(--fail-s);stroke-dasharray:4 3}.n-pill{fill:var(--ink);stroke:var(--ink)}
.t{font-size:13px;font-weight:600;fill:var(--ink)}.s{font-size:11.5px;fill:var(--muted)}.n-pill + .t{fill:var(--bg)}
.l{font-size:11px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.l-fail{fill:var(--fail-s)}
.e{fill:none;stroke:var(--edge);stroke-width:1.4}.e-fail{stroke:var(--fail-s);stroke-dasharray:5 4}.e-data{stroke:var(--store-s);stroke-dasharray:2 3;stroke-width:1.7}.e-live{stroke:var(--live);stroke-width:2}
.m-flow{fill:var(--edge)}.m-fail{fill:var(--fail-s)}.m-data{fill:var(--store-s)}.m-live{fill:var(--live)}
.frame{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 3}.frame-label{font-size:11px;fill:var(--muted)}
.lane{fill:var(--bg);stroke:var(--line)}.lane-label{font-size:12.5px;font-weight:700;fill:var(--muted);letter-spacing:.04em}</style><rect class="bg" width="1150" height="1110" rx="10"/><defs><marker id="d21-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-flow" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d21-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-data" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d21-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-fail" d="M0 0 L10 5 L0 10 z"/></marker><marker id="d21-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="m m-live" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="lane" x="16" y="70" width="1118" height="150" rx="10"/><text class="lane-label" x="28" y="88">EDGE</text><rect class="lane" x="16" y="236" width="1118" height="186" rx="10"/><text class="lane-label" x="28" y="254">STATELESS SERVICES  ·  Kubernetes, autoscaled, 2+ zones</text><rect class="lane" x="16" y="438" width="1118" height="196" rx="10"/><text class="lane-label" x="28" y="456">ASYNC AGENT WORK  ·  scales on queue depth</text><rect class="lane" x="16" y="650" width="1118" height="178" rx="10"/><text class="lane-label" x="28" y="668">DATA</text><rect class="lane" x="16" y="844" width="1118" height="150" rx="10"/><text class="lane-label" x="28" y="862">EXTERNAL PROVIDERS</text><path class="e e-flow" d="M210 130 L270 123" marker-end="url(#d21-flow)"/><path class="e e-flow" d="M210 168 L270 183" marker-end="url(#d21-flow)"/><path class="e e-flow" d="M470 123 L493 123 Q500 123 500 130 L500 133 Q500 140 507 140 L540 140" marker-end="url(#d21-flow)"/><path class="e e-flow" d="M670 194 L670 223 Q670 230 663 230 L172 230 Q165 230 165 237 L165 300" marker-end="url(#d21-flow)"/><path class="e e-flow" d="M290 337 L312 337" marker-end="url(#d21-flow)"/><path class="e e-flow" d="M165 374 L165 385 Q165 392 172 392 L702 392 Q709 392 709 385 L709 374" marker-end="url(#d21-flow)"/><path class="e e-flow" d="M165 374 L165 385 Q165 392 172 392 L974 392 Q981 392 981 385 L981 374" marker-end="url(#d21-flow)"/><path class="e e-flow" d="M981 374 L981 413 Q981 420 974 420 L482 420 Q475 420 475 427 L475 478" marker-end="url(#d21-flow)"/><path class="e e-flow" d="M590 501 L650 501" marker-end="url(#d21-flow)"/><path class="e e-flow" d="M590 530 L618 530 Q625 530 625 537 L625 572 Q625 579 632 579 L650 579" marker-end="url(#d21-flow)"/><path class="e e-live" d="M870 501 L910 501" marker-end="url(#d21-live)"/><path class="e e-live" d="M870 579 L883 579 Q890 579 890 572 L890 537 Q890 530 897 530 L910 530" marker-end="url(#d21-live)"/><path class="e e-live" d="M1015 478 L1015 374" marker-end="url(#d21-live)"/><path class="e e-data" d="M165 374 L165 690" marker-end="url(#d21-data)"/><path class="e e-data" d="M605 374 L605 690" marker-end="url(#d21-data)"/><path class="e e-data" d="M850 610 L850 633 Q850 640 857 640 L1008 640 Q1015 640 1015 647 L1015 690" marker-end="url(#d21-data)"/><path class="e e-flow" d="M755 610 L755 884" marker-end="url(#d21-flow)"/><path class="e e-flow" d="M820 610 L820 853 Q820 860 827 860 L1013 860 Q1020 860 1020 867 L1020 884" marker-end="url(#d21-flow)"/><rect class="n n-ui" x="40" y="112" width="170" height="74" rx="7"/><text class="t" x="125.0" y="145.2" text-anchor="middle">1M users</text><text class="s" x="125.0" y="161.2" text-anchor="middle">browser, React app</text><rect class="n n-ext" x="270" y="100" width="200" height="46" rx="7"/><text class="t" x="370.0" y="119.2" text-anchor="middle">CDN</text><text class="s" x="370.0" y="135.2" text-anchor="middle">static build, cached worldwide</text><rect class="n n-ext" x="270" y="160" width="200" height="46" rx="7"/><text class="t" x="370.0" y="179.2" text-anchor="middle">CDN for files</text><text class="s" x="370.0" y="195.2" text-anchor="middle">S3 files via signed URLs</text><rect class="n n-svc" x="540" y="104" width="260" height="90" rx="7"/><text class="t" x="670.0" y="130.8" text-anchor="middle">Global load balancer + WAF</text><text class="s" x="670.0" y="146.8" text-anchor="middle">TLS, sticky-free, HTTP/2</text><text class="s" x="670.0" y="161.2" text-anchor="middle">per-IP rate limit, bot filter</text><text class="s" x="670.0" y="175.8" text-anchor="middle">long idle timeout for SSE</text><rect class="n n-svc" x="40" y="300" width="250" height="74" rx="7"/><text class="t" x="165.0" y="326.0" text-anchor="middle">gateway ×6–30</text><text class="s" x="165.0" y="342.0" text-anchor="middle">session check, quotas,</text><text class="s" x="165.0" y="356.5" text-anchor="middle">adds x-user-id</text><rect class="n n-svc" x="312" y="300" width="250" height="74" rx="7"/><text class="t" x="437.0" y="326.0" text-anchor="middle">auth ×2–6</text><text class="s" x="437.0" y="342.0" text-anchor="middle">Firebase verify,</text><text class="s" x="437.0" y="356.5" text-anchor="middle">session create/delete</text><rect class="n n-svc" x="584" y="300" width="250" height="74" rx="7"/><text class="t" x="709.0" y="326.0" text-anchor="middle">chat ×4–20</text><text class="s" x="709.0" y="342.0" text-anchor="middle">conversations,</text><text class="s" x="709.0" y="356.5" text-anchor="middle">messages, paging</text><rect class="n n-svc" x="856" y="300" width="250" height="74" rx="7"/><text class="t" x="981.0" y="326.0" text-anchor="middle">agent API ×10–60</text><text class="s" x="981.0" y="342.0" text-anchor="middle">holds SSE streams,</text><text class="s" x="981.0" y="356.5" text-anchor="middle">enqueues runs</text><rect class="n n-store" x="360" y="478" width="230" height="74" rx="7"/><text class="t" x="475.0" y="504.0" text-anchor="middle">Job queue</text><text class="s" x="475.0" y="520.0" text-anchor="middle">Redis Streams / SQS / BullMQ</text><text class="s" x="475.0" y="534.5" text-anchor="middle">one job per message run</text><rect class="n n-agent" x="650" y="470" width="220" height="62" rx="7"/><text class="t" x="760.0" y="497.2" text-anchor="middle">LLM workers ×20–200</text><text class="s" x="760.0" y="513.2" text-anchor="middle">LangGraph: router, chat, search, code</text><rect class="n n-agent" x="650" y="548" width="220" height="62" rx="7"/><text class="t" x="760.0" y="575.2" text-anchor="middle">File workers ×5–40</text><text class="s" x="760.0" y="591.2" text-anchor="middle">Puppeteer pool: pdf, ppt; imageGen</text><rect class="n n-out" x="910" y="478" width="210" height="74" rx="7"/><text class="t" x="1015.0" y="504.0" text-anchor="middle">Token fan-out</text><text class="s" x="1015.0" y="520.0" text-anchor="middle">Redis pub/sub channel run:&lt;id&gt;</text><text class="s" x="1015.0" y="534.5" text-anchor="middle">→ the pod holding the stream</text><path class="n n-store" d="M40 698 A125.0 8 0 0 1 290 698 L290 792 A125.0 8 0 0 1 40 792 Z"/><path class="n n-store" d="M40 698 A125.0 8 0 0 0 290 698" fill="none"/><text class="t" x="165.0" y="730.8" text-anchor="middle">Redis cluster</text><text class="s" x="165.0" y="746.8" text-anchor="middle">3 shards × replica</text><text class="s" x="165.0" y="761.2" text-anchor="middle">sessions, rate limits,</text><text class="s" x="165.0" y="775.8" text-anchor="middle">response cache, pub/sub</text><path class="n n-store" d="M330 698 A150.0 8 0 0 1 630 698 L630 792 A150.0 8 0 0 1 330 792 Z"/><path class="n n-store" d="M330 698 A150.0 8 0 0 0 630 698" fill="none"/><text class="t" x="480.0" y="730.8" text-anchor="middle">MongoDB sharded cluster</text><text class="s" x="480.0" y="746.8" text-anchor="middle">shard key: userId</text><text class="s" x="480.0" y="761.2" text-anchor="middle">read replicas for history</text><text class="s" x="480.0" y="775.8" text-anchor="middle">index (conversationId, createdAt)</text><path class="n n-store" d="M910 698 A105.0 8 0 0 1 1120 698 L1120 792 A105.0 8 0 0 1 910 792 Z"/><path class="n n-store" d="M910 698 A105.0 8 0 0 0 1120 698" fill="none"/><text class="t" x="1015.0" y="738.0" text-anchor="middle">S3 bucket</text><text class="s" x="1015.0" y="754.0" text-anchor="middle">private, lifecycle rules</text><text class="s" x="1015.0" y="768.5" text-anchor="middle">old files → cheaper tier</text><rect class="n n-ext" x="40" y="884" width="250" height="90" rx="7"/><text class="t" x="165.0" y="918.0" text-anchor="middle">Firebase Auth</text><text class="s" x="165.0" y="934.0" text-anchor="middle">Google sign-in,</text><text class="s" x="165.0" y="948.5" text-anchor="middle">verified by the auth pods</text><rect class="n n-llm" x="620" y="884" width="270" height="90" rx="7"/><text class="t" x="755.0" y="910.8" text-anchor="middle">LLM gateway</text><text class="s" x="755.0" y="926.8" text-anchor="middle">pools keys, per-model limits, retries</text><text class="s" x="755.0" y="941.2" text-anchor="middle">fails over Groq ↔ OpenRouter ↔ Gemini</text><text class="s" x="755.0" y="955.8" text-anchor="middle">token budgets per user and plan</text><rect class="n n-ext" x="920" y="884" width="200" height="90" rx="7"/><text class="t" x="1020.0" y="918.0" text-anchor="middle">Tools</text><text class="s" x="1020.0" y="934.0" text-anchor="middle">Tavily web search</text><text class="s" x="1020.0" y="948.5" text-anchor="middle">image API (Pollinations or paid)</text><text class="t" x="20" y="34" text-anchor="start">Step 2 · Refined: Aryan&#x27;s Assistant for 1 million users</text><text class="s" x="20" y="54" text-anchor="start">Assumed load: 1M users, ~150k daily, ~15k online at peak → ~500 messages/s and ~15k open SSE streams. Numbers are planning estimates.</text><text class="l" x="240" y="112" text-anchor="middle">① app</text><text class="l" x="505" y="116" text-anchor="middle">② /api</text><text class="l" x="440" y="388" text-anchor="middle">③ verified request</text><text class="s" x="312" y="290" text-anchor="start">No state in pods: any pod can serve any request</text><text class="l" x="540" y="416" text-anchor="middle">④ enqueue</text><text class="l" x="625" y="495" text-anchor="middle">⑤ pull</text><text class="l" x="1023" y="440" text-anchor="start">⑦ tokens</text><text class="s" x="190" y="584" text-anchor="start">Slow jobs never block a web pod.</text><text class="s" x="190" y="600" text-anchor="start">Retries, timeouts, dead-letter queue.</text><text class="l" x="173" y="660" text-anchor="start">sessions</text><text class="l" x="598" y="660" text-anchor="end">⑧ save reply</text><text class="l" x="935" y="634" text-anchor="middle">⑨ files</text><text class="l" x="763" y="760" text-anchor="start">⑥ LLM calls</text><text class="l" x="930" y="854" text-anchor="middle">search, images</text><text class="t" x="20" y="1018" text-anchor="start">What changes from today</text><text class="s" x="20" y="1040" text-anchor="start">• One Redis container → Redis cluster with replicas. One MongoDB → sharded cluster keyed by userId. Chat pods save replies for the workers.</text><text class="s" x="20" y="1057" text-anchor="start">• Agent runs move off the web pods into queue workers; Puppeteer runs in its own pool with a fixed number of browsers.</text><text class="s" x="20" y="1074" text-anchor="start">• Tokens travel worker → Redis pub/sub → the pod holding the SSE stream, so any pod can serve any user.</text><text class="s" x="20" y="1091" text-anchor="start">• An LLM gateway shares load across keys and providers; per-user quotas protect cost. OpenTelemetry, Prometheus and alerts on every layer.</text></svg>
